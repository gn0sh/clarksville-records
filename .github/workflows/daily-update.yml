# Daily update and GitHub Pages deploy for https://daylight.gnoshcodes.com/
#
# update job : collect politely, rebuild, check, upload the refreshed data/ and the site as artifacts. It parses
#              untrusted downloaded PDFs, so it has read-only repo access and no persisted token. It never publishes.
# push job   : commits the refreshed data/ (from the update job's artifact) to main. The only job with contents: write;
#              it parses nothing.
# deploy job : publishes that artifact to GitHub Pages. LOCKED until launch: it runs only when the repository variable
#              RECORDS_DEPLOY_ENABLED is exactly 'true'. Setting that variable is the CEO's go-live step (hard stop 1).
#              See docs/ops/launch-runbook.md.
# note job   : sends the morning note from the update job's plan. LOCKED: only on schedule, on main, when the
#              repository variable MORNING_NOTE_SEND is exactly 'true', after deploy succeeded. The only job with
#              secrets (BUTTONDOWN_API_KEY, MORNING_NOTE_CANARY_IDS, in the morning-note environment), each in one
#              step's env. See docs/ops/morning-note.md. Every other job uses GITHUB_TOKEN only.
# note-failed: opens or comments on one "Daily update: morning note failed" issue when the note job failed.
#
# Collection keeps the collector's own rules (collector/fetch.py): one honest User-Agent, robots.txt obeyed, at least
# 10 s between requests per host (more where robots.txt asks). Nothing here changes them.
name: Daily update

on:
  schedule:
    - cron: "7 9 * * *"        # 09:07 UTC daily (03:07 CST / 04:07 CDT), off the hour to avoid the scheduler rush
  workflow_dispatch:
    inputs:
      collect:
        description: "Fetch new records first (false = rebuild and redeploy from the committed data only, no fetching)"
        type: boolean
        default: true

# One run at a time, never cancel one mid-fetch or mid-deploy.
concurrency:
  group: daily-update
  cancel-in-progress: false

permissions: {}

# Build overrides, set on the build and check steps only (the tests assert the defaults, so they run without them):
#   RECORDS_SITE_URL   feeds carry absolute links to the public site (read by sitegen/config.py and qa/site_checks.py)
#   RECORDS_BUILD_TARGET=pages  file cap of GitHub Pages (3000), not the claude.ai preview's 500

jobs:
  update:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.checkout.outputs.commit }}   # the main commit this run built on; the push job commits on it
    # A warm daily run takes minutes (10 s per request, only new documents). A cold cache (first run, or after the
    # cache was evicted) refetches about 930 documents at 10 s each plus parsing: budget the hosted-runner maximum.
    timeout-minutes: 355
    permissions:
      contents: read         # check out main; the token is NOT persisted (pipeline/token-exposure-untrusted-parse)
      issues: write          # open one issue when a run fails
    steps:
      - name: Check out main
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false  # untrusted PDFs are parsed in this job: no token on disk

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      # requirements.lock is pip-compile's output from requirements.txt (Python 3.12, every package and every
      # transitive one pinned with its sha256): --require-hashes refuses any file that does not match
      # (deps/transitive-unpinned). Regenerate it after changing requirements.txt; see the lock file's header.
      - name: Install system tools and Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr
          python -m pip install --require-hashes -r requirements.lock

      # The text and OCR caches below are only valid for the tesseract and poppler (pdftotext) that wrote them: their
      # version lines, hashed, are part of that cache's key, so an image update starts a fresh cache.
      - name: Record OCR tool versions
        id: tools
        run: |
          set -euo pipefail
          v=$( { tesseract --version 2>&1 | head -n 1; pdftotext -v 2>&1 | head -n 1; } | sha256sum | cut -c1-16)
          [[ "$v" =~ ^[0-9a-f]{16}$ ]]
          echo "versions=$v" >> "$GITHUB_OUTPUT"

      # data/store/ (the downloaded PDFs, about 3 GB, never committed) is kept between runs in the Actions cache.
      - name: Restore document store
        id: store
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/store
          key: records-store-v1-${{ github.run_id }}
          restore-keys: records-store-v1-

      # data/text and data/ocr (text layers and tesseract readings, keyed by the document's sha256 and page) are kept
      # too, in their own cache so the store's cache key and version stay as they are. With them restored, a document
      # whose hash is unchanged is never OCR'd again: only newly fetched documents are (pipeline/re-ocr-every-run).
      # The key carries a hash of the code and tools that write these files (ci/derived-cache-integrity), so a change
      # to the extractor, the OCR or a pinned package starts a fresh cache instead of reusing old readings. Only the
      # scheduled run on main saves it, so a manual run on another ref cannot seed the cache main restores.
      - name: Restore text and OCR caches
        id: derived
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            data/text
            data/ocr
          key: records-derived-v1-${{ steps.tools.outputs.versions }}-${{ hashFiles('collector/extract.py', 'collector/ocr.py', 'requirements.txt') }}-${{ github.run_id }}
          restore-keys: records-derived-v1-${{ steps.tools.outputs.versions }}-${{ hashFiles('collector/extract.py', 'collector/ocr.py', 'requirements.txt') }}-

      - name: Count stored files before collection
        run: |
          echo "STORE_BEFORE=$(find data/store -type f 2>/dev/null | wc -l)" >> "$GITHUB_ENV"
          echo "DERIVED_BEFORE=$(find data/text data/ocr -type f 2>/dev/null | wc -l)" >> "$GITHUB_ENV"

      - name: Collect (polite fetch, parse, verify)
        id: collect
        if: github.event_name == 'schedule' || inputs.collect
        env:
          RECORDS_SITE_URL: https://daylight.gnoshcodes.com/
          RECORDS_BUILD_TARGET: pages
        run: |
          set +e
          # City first: it rewrites data/localities/clarksville-tn/*. The county run then builds facts, finance and
          # the site (build/site) from everything; it also reads the County Commission agenda page and any new agenda
          # PDFs (collector/county_agenda.py: one page request, new PDFs only, the same polite fetcher).
          # Exit codes (docs/ops/launch-runbook.md "Exit codes"). Hard failures fail this step: nothing is uploaded,
          # committed or deployed, the committed data/ on main is untouched and one issue opens.
          #   city:   0 ok, 2 a listing not read (or fetch/parse failures), 5 a host or robots.txt refused us.
          #   county: 0 ok, 2 fetch/parse failures, 3 gate failure, 4 offline run refused.
          # The county run also runs the Regional Planning Commission step (collector/rpc.py run_step: the listing
          # page and new documents from www.cmcrpc.com through the same polite fetcher; robots.txt crawl-delay 10; the
          # first 403/429 ends that host's requests for the run). It is all or nothing: unless it succeeds, the RPC
          # files stay exactly as committed, so one source never freezes the daily refresh: its codes, used only when
          # everything else is ok, are warnings, and the city, county and finance data still commit and deploy:
          #   5 the RPC step failed (blocked, listing not read, a gate, a result that would shrink the record, or a
          #     backlog that needs a person: TooManyNew, a cut-off by the cap): a warning, and the step below opens
          #     or comments on one RPC-only issue.
          #   6 partial: the RPC document store is still being filled (at most 40 requests per run): a warning.
          python -m collector city run; city=$?
          python -m collector run; county=$?
          echo "city_exit=$city county_exit=$county"
          echo "city=$city" >> "$GITHUB_OUTPUT"
          echo "county=$county" >> "$GITHUB_OUTPUT"
          rpc=ok
          if [ "$county" = 6 ]; then
            echo "::warning::The RPC document store is still being filled; the RPC pages use the committed data."
            rpc=filling; county=0
          elif [ "$county" = 5 ]; then
            echo "::warning::The RPC step failed; the RPC files are unchanged and everything else is published. See the RPC issue."
            rpc=failed; county=0
          fi
          echo "rpc=$rpc" >> "$GITHUB_OUTPUT"
          [ "$city" = 0 ] && [ "$county" = 0 ]

      # Only for a manual rebuild-only run (collect=false): build from the committed data, no network.
      - name: Rebuild site from committed data
        if: github.event_name == 'workflow_dispatch' && !inputs.collect
        env:
          RECORDS_SITE_URL: https://daylight.gnoshcodes.com/
          RECORDS_BUILD_TARGET: pages
        run: |
          python -m sitegen --facts data/facts.json --out build/site
          python -m collector export

      - name: Site checks
        env:
          RECORDS_SITE_URL: https://daylight.gnoshcodes.com/
          RECORDS_BUILD_TARGET: pages
        run: python -m qa.site_checks --site build/site --facts data/facts.json --store data/store --no-browser

      # Morning note, plan stage (docs/architecture/morning-note.md "Workflow changes"): the dry run, every day, no
      # network and no secret. It reads build/site/morning/<today>.json and writes build/morning-send/<today>/ (no
      # subscriber data: safe as a public artifact). While the sender is disabled it is a rehearsal and exits 0 on a
      # plan error. continue-on-error: a failed plan never fails this job or holds back the data commit and deploy;
      # the note job then finds no artifact, fails, and opens its own issue.
      - name: Plan the morning note (dry run, no network)
        id: plan
        continue-on-error: true
        env:
          RECORDS_SITE_URL: https://daylight.gnoshcodes.com/   # the editions link site pages from alerts.site_url
        run: python -m sender plan --rehearse --site build/site --out build/morning-send

      - name: Tests (full suite, about 12 min, default settings)
        run: python -m pytest -q -x

      # Failed collection or checks: the steps below that publish do not run (no commit, no new artifact, no deploy).
      # The last deployed site stays up. One open issue: created once, then a comment on each later failure.
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          CITY_EXIT: ${{ steps.collect.outputs.city }}
          COUNTY_EXIT: ${{ steps.collect.outputs.county }}
        run: |
          title="Daily update failed"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          body="Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (collector exits: city=$CITY_EXIT, county=$COUNTY_EXIT). The last deployed site is unchanged."
          # a later failure comments on the open issue, so a repeat is never silent (ci/failure-issue-silent-repeat)
          if [ -z "$open" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi

      # The RPC step failed while everything else was ok (county exit 5): one open issue for the RPC alone, with a
      # comment each later day instead of a new issue. The reason is read from build/run-log.json into a file and
      # passed with --body-file, never through the shell or an expression.
      - name: Open or update the RPC issue
        if: always() && steps.collect.outputs.rpc == 'failed'
        env:
          GH_TOKEN: ${{ github.token }}
          RPC_TITLE: "Daily update: RPC step failed"
        run: |
          set -eu
          body="$RUNNER_TEMP/rpc-issue.md"
          {
            echo "The Regional Planning Commission step failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "The RPC files are unchanged; the city, county and finance data were published as usual."
            echo
            echo "Reason (build/run-log.json rpc.status):"
            echo
            echo '```'
            # backticks are dropped so site text cannot close the fence (ci/issue-markdown-fence); a missing or
            # unreadable run-log.json gives "unknown" (ci/issue-reason-missing)
            reason=$(set -o pipefail; jq -r '.rpc.status // "unknown"' build/run-log.json 2>/dev/null | tr -d '`' | head -c 1500) \
              || reason=unknown
            [ -n "$reason" ] || reason=unknown
            echo "$reason"
            echo
            echo '```'
            echo "If it says TooManyNew or 'the cap of', it repeats every day until someone acts: see"
            echo "docs/ops/launch-runbook.md, 'RPC backlog'."
          } > "$body"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$RPC_TITLE\" in:title" \
                   --json number,title --jq 'map(select(.title == $ENV.RPC_TITLE)) | .[0].number // empty')
          if [ -z "$open" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$RPC_TITLE" --body-file "$body"
          else
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          fi

      # Keep newly fetched PDFs even when a later step failed, so a retry does not refetch them (10 s each).
      - name: Check whether the store grew
        if: always() && steps.store.conclusion == 'success'
        run: echo "STORE_GREW=$([ "$(find data/store -type f 2>/dev/null | wc -l)" -gt "$STORE_BEFORE" ] && echo yes || echo no)" >> "$GITHUB_ENV"

      - name: Save document store
        if: always() && env.STORE_GREW == 'yes'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/store
          key: records-store-v1-${{ github.run_id }}

      - name: Check whether the text and OCR caches grew
        if: always() && steps.derived.conclusion == 'success'
        run: echo "DERIVED_GREW=$([ "$(find data/text data/ocr -type f 2>/dev/null | wc -l)" -gt "$DERIVED_BEFORE" ] && echo yes || echo no)" >> "$GITHUB_ENV"

      - name: Save text and OCR caches
        if: always() && env.DERIVED_GREW == 'yes' && github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            data/text
            data/ocr
          key: records-derived-v1-${{ steps.tools.outputs.versions }}-${{ hashFiles('collector/extract.py', 'collector/ocr.py', 'requirements.txt') }}-${{ github.run_id }}

      # The data commit happens in the separate push job, so this job never holds a write token.
      # Not uploaded: the git-ignored caches (the 3 GB document store and derived text/OCR).
      - name: Upload refreshed data
        if: success() && (github.event_name == 'schedule' || inputs.collect)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: records-data
          path: |
            data
            !data/store
            !data/raw
            !data/text
            !data/ocr
            !data/out
          retention-days: 2
          if-no-files-found: error

      # Pages deployed from Actions takes the domain from the repository settings; the file keeps the domain with the
      # build output (and serves a branch-based deploy too).
      - name: Add CNAME
        if: success()
        run: cp deploy/CNAME build/site/CNAME

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: build/site
          retention-days: 2

      # The plan for the note job (no subscriber data, no secret). Only a plan that was written is uploaded.
      - name: Upload the morning note plan
        if: success() && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: morning-send
          path: build/morning-send
          retention-days: 2
          if-no-files-found: ignore   # a rehearsal that wrote nothing must not fail this job

  push:
    needs: update
    # main only (pipeline/dispatch-non-main-ref): a manual run on another branch must never commit to main.
    if: (github.event_name == 'schedule' || inputs.collect) && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write        # commit refreshed data/ to main: the only job that can write to the repository
      issues: write          # open one issue when this job fails (pipeline/push-failure-silent)
    steps:
      # The exact commit the update job built on, not whatever main is now: the data commit is made on it, then
      # rebased onto main below, so a concurrent edit to data/ is a loud conflict, never a silent revert
      # (pipeline/push-reverts-concurrent-data).
      - name: Check out the commit the update job built on
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.update.outputs.sha }}

      - name: Download refreshed data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: records-data
          path: ${{ runner.temp }}/records-data

      # The artifact came from the job that parses untrusted PDFs: treat it as input (pipeline/push-unvalidated-artifact).
      # Allowed: regular files named *.json or *.yml, and the change logs the collector appends beside each manifest
      # when a document changes (files named exactly changes.jsonl: pipeline/changes-jsonl-rejected). None over
      # 50 MB, no symlinks. The files are only committed, never run or parsed here.
      - name: Validate refreshed data
        run: |
          set -eu
          dir="$RUNNER_TEMP/records-data"
          bad=0
          while IFS= read -r -d '' f; do
            echo "::error::not a regular file or directory (symlink or special file): $f"; bad=1
          done < <(find "$dir" ! -type f ! -type d -print0)
          while IFS= read -r -d '' f; do
            case "$f" in
              *.json|*.yml|*/changes.jsonl) ;;
              *) echo "::error::file type not allowed in data/: $f"; bad=1 ;;
            esac
          done < <(find "$dir" -type f -print0)
          while IFS= read -r -d '' f; do
            echo "::error::file over 50 MB: $f"; bad=1
          done < <(find "$dir" -type f -size +50M -print0)
          [ "$bad" = 0 ]

      - name: Commit refreshed data to main
        run: |
          # data/ in a fresh checkout holds only tracked files (the ignored caches are absent), so replacing it whole
          # keeps deletions too. Only data/ is ever staged.
          rm -rf data
          cp -a "$RUNNER_TEMP/records-data" data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily update: refreshed records data ($(date -u +%F))"
            # A concurrent change to data/ on main conflicts here and fails the job (the failure step opens the issue).
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Daily update failed"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          body="The push job failed (data not committed to main): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. The last deployed site is unchanged."
          if [ -z "$open" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi

  deploy:
    needs: [update, push]
    # LOCKED: does not run until the CEO sets the repository variable RECORDS_DEPLOY_ENABLED to 'true' (Settings >
    # Secrets and variables > Actions > Variables). Do not remove this condition. Hard stop 1.
    # Also main only (pipeline/dispatch-non-main-ref).
    # After the lock (pipeline/deploy-independent-of-push): update must have succeeded, and push must have succeeded
    # too, so the site never goes live from data that is not on main. The one run where push is skipped by design is
    # the manual rebuild-only run (collect = false: nothing to commit; the runbook's rollback path), which still
    # deploys. !cancelled() is there because a job whose `needs` include a skipped job is itself skipped unless its
    # `if` calls a status function; every job result is then tested by name, so this only ever narrows the lock.
    if: >-
      vars.RECORDS_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
      && !cancelled() && needs.update.result == 'success'
      && (needs.push.result == 'success'
      || (needs.push.result == 'skipped' && github.event_name == 'workflow_dispatch' && !inputs.collect))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write           # publish to GitHub Pages
      id-token: write        # deploy-pages verifies the artifact's origin with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # Morning note, deliver stage (docs/architecture/morning-note.md "Workflow changes"; runbook docs/ops/morning-note.md).
  # LOCKED: runs only on the daily schedule, on main, when the repository variable MORNING_NOTE_SEND is exactly
  # 'true' (Brian's go-live switch, hard stop 1), and only after update and deploy both succeeded (so it cannot run
  # while the deploy is locked, and an email never links a page that is not live). A manual run never sends. It
  # runs after deploy, so a note failure can never hold back the data commit or the deploy; it opens its own issue
  # (the note-failed job), never the "Daily update failed" one.
  # Least privilege: contents: read and pull-requests: read only (the PR check below reads, never writes); the
  # job's GITHUB_TOKEN is given to that one step only. The API key and the canary ids are secrets of the `morning-note`
  # environment (deployment branch main only), each given as env to the one step that needs it, never in a `run:`
  # expression. No pip install, no cache, no artifact upload, no step summary; the deliver stage prints totals only.
  # Never twice across runs: the workflow-level `concurrency: daily-update` group (one run at a time, never
  # cancelled) holds this job too; do not give it a group of its own.
  note:
    needs: [update, deploy]
    if: github.event_name == 'schedule' && vars.MORNING_NOTE_SEND == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read    # the "reached main by pull request" check only
    environment: morning-note
    steps:
      # First, before anything else: the canary ids are masked one by one (the secret as a whole is masked by
      # GitHub, a single id taken from it is not).
      - name: Mask the canary ids
        env:
          CANARY_IDS: ${{ secrets.MORNING_NOTE_CANARY_IDS }}
        run: |
          # Split the whole value (every line) on commas and whitespace, as sender/deliver.py canary_ids does: every
          # ASCII character Python's \s matches, \r included, so a secret pasted with CRLF line ends still masks each
          # id (note-job/mask-ifs-cr). Any other character fails canary_ids' id check, and nothing is sent.
          set -f
          IFS=$', \t\r\n\v\f\x1c\x1d\x1e\x1f'
          for id in ${CANARY_IDS:-}; do
            if [ -n "$id" ]; then echo "::add-mask::$id"; fi
          done

      # This run's own commit (security L6), not the update job's output; no token on disk.
      - name: Check out this run's commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # A re-run of an older run ("Re-run all jobs") checks out that day's github.sha and runs that day's workflow
      # file, while the update job builds the plan from today's main. Refuse unless this commit's sender code, site
      # config and this workflow file are main's (note-job/stale-rerun, note-job/stale-rerun-workflow-gap). The
      # repository is public, so the fetch needs no token (none is kept on disk).
      - name: Check this commit's sender and config are main's
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          if ! git diff --quiet HEAD FETCH_HEAD -- config/site.yml sender/ .github/workflows/daily-update.yml; then
            echo "::error::config/site.yml, sender/ or the workflow differ from main: an older run was re-run. Nothing sent."
            exit 2
          fi

      # main-protect/actions-bypass-reopens-M1, main-protect/pr-check-last-commit-only: the main ruleset lets GitHub
      # Actions push main directly (for the push job's data/ commit), so a workflow on any branch could put changed
      # sender code, config or workflows on main without a pull request. Refuse unless EVERY commit on this commit's
      # first-parent line (main's own commits: no commit of a merged-in branch counts) after MAIN_PR_BASELINE that
      # touches sender/, config/site.yml or .github/ is the merge or squash commit of a merged pull request into main.
      # Checking only the newest such commit would let any later PR launder an earlier direct push.
      # MAIN_PR_BASELINE is main's commit at go-live (runbook docs/ops/morning-note.md 4.7): history up to and
      # including it was checked by hand then. Until it is set to a 40-hex commit on main's first-parent line the
      # step refuses (fail closed). Changing it is a change to .github/, so it needs a PR itself, and that PR is
      # after any baseline it can name, so it is always checked. The daily data/ commits touch none of those paths,
      # so they never trip it. From go-live on, every change to those paths reaches main by a pull request merged
      # with "Create a merge commit" or "Squash and merge" (runbook 2.0). This does not stop a writer who merges
      # their own PR (0 approvals), nor a pushed workflow that drops this step: the runbook's required reviewer on
      # the morning-note environment does. The history is fetched without file contents.
      - name: Check sender, config and workflow changes reached main by pull request
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_PR_BASELINE: ""   # go-live: set to main's commit sha by PR (runbook 4.7); empty refuses every send
        run: |
          set -euo pipefail
          base="${MAIN_PR_BASELINE:-}"
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::MAIN_PR_BASELINE is not set to a commit sha (runbook docs/ops/morning-note.md 4.7). Nothing sent."; exit 2
          fi
          deepen=()
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then deepen=(--unshallow); fi
          git fetch --no-tags --filter=blob:none "${deepen[@]}" origin main
          if [ "$(git rev-parse --is-shallow-repository)" != false ]; then
            echo "::error::could not read main's full history. Nothing sent."; exit 2
          fi
          on_line=$(git rev-list --first-parent HEAD | grep -Fxc -- "$base" || true)
          if [ "$on_line" != 1 ]; then
            echo "::error::MAIN_PR_BASELINE $base is not a commit on main's first-parent line. Nothing sent."; exit 2
          fi
          shas=$(git log --first-parent --format=%H "$base..HEAD" -- sender/ config/site.yml .github/)
          if [ -z "$shas" ]; then
            echo "::error::no commit after MAIN_PR_BASELINE touches sender/, config/site.yml or .github/ (the commit that set it must). Nothing sent."; exit 2
          fi
          for sha in $shas; do
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::unexpected git log output. Nothing sent."; exit 2; fi
            n=$(SHA="$sha" gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --jq \
                  '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $ENV.SHA)] | length')
            if [ "$n" != 1 ]; then
              echo "::error::$sha (a change to sender/, config/site.yml or .github/ on main after MAIN_PR_BASELINE) is not the merge of a pull request into main. Nothing sent."
              exit 2
            fi
          done
          echo "Every change to sender/, config/site.yml or .github/ on main after $base was merged by pull request: $(echo "$shas" | wc -l) commit(s)."

      - name: Set up Python (standard library only, no pip step)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Outside the checkout: the plan comes from the job that parses untrusted PDFs.
      - name: Download the morning note plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: morning-send
          path: ${{ runner.temp }}/morning-send

      # The files: one <YYYY-MM-DD>/ folder holding plan.json and edition-<key>.html|.txt only, regular files (no
      # symlink), at most MAX_PLAN_BYTES (sender/common.py) in total. The plan's schema, field types, bodies and links
      # are checked by the next step (sender.deliver.check_plan, with link_hosts from the repository's config).
      - name: Validate the plan files
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/morning-send"
          max=$(python -E -s -c 'from sender.common import MAX_PLAN_BYTES; print(int(MAX_PLAN_BYTES))')
          bad=0
          while IFS= read -r -d '' f; do echo "::error::not a regular file or folder: ${f#"$dir"/}"; bad=1
          done < <(find "$dir" -mindepth 1 ! -type f ! -type d -print0)
          days=$(find "$dir" -mindepth 1 -maxdepth 1 -type d | wc -l)
          others=$(find "$dir" -mindepth 1 -maxdepth 1 ! -type d | wc -l)
          if [ "$days" != 1 ] || [ "$others" != 0 ]; then echo "::error::expected one day folder"; bad=1; fi
          day=$(find "$dir" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | head -n 1)
          [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::the day folder is not a date"; bad=1; }
          while IFS= read -r -d '' f; do
            name="${f##*/}"
            [[ "$name" == plan.json || "$name" =~ ^edition-[0-9a-f]{12}\.(html|txt)$ ]] \
              || { echo "::error::file not allowed in the plan"; bad=1; }
          done < <(find "$dir" -mindepth 2 -print0)
          [ -f "$dir/$day/plan.json" ] || { echo "::error::no plan.json"; bad=1; }
          [ -z "$(find "$dir" -mindepth 3 -print -quit)" ] || { echo "::error::nested folders"; bad=1; }
          total=$(find "$dir" -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          [ "$total" -le "$max" ] || { echo "::error::the plan is over MAX_PLAN_BYTES"; bad=1; }
          [ "$bad" = 0 ]
          echo "PLAN=$dir/$day/plan.json" >> "$GITHUB_ENV"

      # The dry run first: checks the plan (check_plan) and prints what would be sent; no connection, no secret.
      - name: Check the plan (dry run, no secret)
        run: python -E -s -m sender deliver --plan "$PLAN"

      # The only step with the API key. --live only when the variable is exactly 'true' (the job's own `if:` already
      # requires it; this is the second lock). Totals only in the log.
      - name: Deliver the morning note
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          MORNING_NOTE_CANARY_IDS: ${{ secrets.MORNING_NOTE_CANARY_IDS }}
          MORNING_NOTE_SEND: ${{ vars.MORNING_NOTE_SEND }}
        run: |
          live=()
          if [ "$MORNING_NOTE_SEND" = "true" ]; then live=(--live); fi
          python -E -s -m sender deliver --plan "$PLAN" "${live[@]}"

  # The note job failed or was cancelled (by hand or by GitHub): one open "Daily update: morning note
  # failed" issue, a comment on it on later days (note-failed/silent-noncompletion). A separate job with fixed text
  # (the job holding the key opens nothing and has no issues permission). Skipped (locked) never opens one.
  note-failed:
    needs: note
    if: always() && (needs.note.result == 'failure' || needs.note.result == 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the morning note issue
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE_TITLE: "Daily update: morning note failed"
        run: |
          set -eu
          body="The morning note job failed or was cancelled: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. The site, the data commit and the deploy are not affected. A note is never sent the next day; see docs/ops/morning-note.md, 'When the note job fails'."
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$NOTE_TITLE\" in:title" \
                   --json number,title --jq 'map(select(.title == $ENV.NOTE_TITLE)) | .[0].number // empty')
          if [ -z "$open" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$NOTE_TITLE" --body "$body"
          else
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
