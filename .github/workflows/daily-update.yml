# Daily update and GitHub Pages deploy for https://records.gnoshcodes.com/
#
# update job : collect politely, rebuild, check, commit refreshed data to main, upload the site as a Pages artifact.
#              Runs daily and on demand. It never publishes anything.
# deploy job : publishes that artifact to GitHub Pages. LOCKED until launch: it runs only when the repository variable
#              RECORDS_DEPLOY_ENABLED is exactly 'true'. Setting that variable is the CEO's go-live step (hard stop 1).
#              See docs/ops/launch-runbook.md. No secrets are used anywhere; GITHUB_TOKEN is the only credential.
#
# Collection keeps the collector's own rules (collector/fetch.py): one honest User-Agent, robots.txt obeyed, at least
# 10 s between requests per host (more where robots.txt asks). Nothing here changes them.
name: Daily update

on:
  schedule:
    - cron: "7 9 * * *"        # 09:07 UTC daily (03:07 CST / 04:07 CDT), off the hour to avoid the scheduler rush
  workflow_dispatch:
    inputs:
      collect:
        description: "Fetch new records first (false = rebuild and redeploy from the committed data only, no fetching)"
        type: boolean
        default: true

# One run at a time, never cancel one mid-fetch or mid-deploy.
concurrency:
  group: daily-update
  cancel-in-progress: false

permissions: {}

# Build overrides, set on the build and check steps only (the tests assert the defaults, so they run without them):
#   RECORDS_SITE_URL   feeds carry absolute links to the public site (read by sitegen/config.py and qa/site_checks.py)
#   RECORDS_MAX_FILES  the 500-file cap is the claude.ai preview limit, not GitHub Pages'

jobs:
  update:
    runs-on: ubuntu-24.04
    # A warm daily run takes minutes (10 s per request, only new documents). A cold cache (first run, or after the
    # cache was evicted) refetches about 930 documents at 10 s each plus parsing: budget the hosted-runner maximum.
    timeout-minutes: 355
    permissions:
      contents: write        # commit refreshed data/ to main
      issues: write          # open one issue when a run fails
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: true   # needed for the data commit below (GITHUB_TOKEN, contents: write only)

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system tools and Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr
          python -m pip install -r requirements.txt

      # data/store/ (the downloaded PDFs, about 3 GB, never committed) is kept between runs in the Actions cache.
      - name: Restore document store
        id: store
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/store
          key: records-store-v1-${{ github.run_id }}
          restore-keys: records-store-v1-

      - name: Count stored files before collection
        run: echo "STORE_BEFORE=$(find data/store -type f 2>/dev/null | wc -l)" >> "$GITHUB_ENV"

      - name: Collect (polite fetch, parse, verify)
        id: collect
        if: github.event_name == 'schedule' || inputs.collect
        env:
          RECORDS_SITE_URL: https://records.gnoshcodes.com/
          RECORDS_MAX_FILES: "5000"
        run: |
          set +e
          # City first: it rewrites data/localities/clarksville-tn/*. The county run then builds facts, finance and
          # the site (build/site) from everything. Exit 0 ok, 2 fetch/parse failures, 3 gate failure.
          python -m collector city run; city=$?
          python -m collector run; county=$?
          echo "city_exit=$city county_exit=$county"
          echo "city=$city" >> "$GITHUB_OUTPUT"
          echo "county=$county" >> "$GITHUB_OUTPUT"
          [ "$city" = 0 ] && [ "$county" = 0 ]

      # Only for a manual rebuild-only run (collect=false): build from the committed data, no network.
      - name: Rebuild site from committed data
        if: github.event_name == 'workflow_dispatch' && !inputs.collect
        env:
          RECORDS_SITE_URL: https://records.gnoshcodes.com/
          RECORDS_MAX_FILES: "5000"
        run: |
          python -m sitegen --facts data/facts.json --out build/site
          python -m collector export

      - name: Site checks
        env:
          RECORDS_SITE_URL: https://records.gnoshcodes.com/
          RECORDS_MAX_FILES: "5000"
        run: python -m qa.site_checks --site build/site --facts data/facts.json --store data/store --no-browser

      - name: Tests (full suite, about 12 min, default settings)
        run: python -m pytest -q -x

      # Failed collection or checks: the steps below that publish do not run (no commit, no new artifact, no deploy).
      # The last deployed site stays up. One open issue is enough: skip when one exists.
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Daily update failed"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -z "$open" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (collector exits: city=${{ steps.collect.outputs.city }}, county=${{ steps.collect.outputs.county }}). The last deployed site is unchanged."
          fi

      # Keep newly fetched PDFs even when a later step failed, so a retry does not refetch them (10 s each).
      - name: Check whether the store grew
        if: always() && steps.store.conclusion == 'success'
        run: echo "STORE_GREW=$([ "$(find data/store -type f 2>/dev/null | wc -l)" -gt "$STORE_BEFORE" ] && echo yes || echo no)" >> "$GITHUB_ENV"

      - name: Save document store
        if: always() && env.STORE_GREW == 'yes'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/store
          key: records-store-v1-${{ github.run_id }}

      - name: Commit refreshed data to main
        if: success() && (github.event_name == 'schedule' || inputs.collect)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily update: refreshed records data ($(date -u +%F))"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # Pages deployed from Actions takes the domain from the repository settings; the file keeps the domain with the
      # build output (and serves a branch-based deploy too).
      - name: Add CNAME
        if: success()
        run: cp deploy/CNAME build/site/CNAME

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: build/site
          retention-days: 2

  deploy:
    needs: update
    # LOCKED: does not run until the CEO sets the repository variable RECORDS_DEPLOY_ENABLED to 'true' (Settings >
    # Secrets and variables > Actions > Variables). Do not remove this condition. Hard stop 1.
    if: vars.RECORDS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write           # publish to GitHub Pages
      id-token: write        # deploy-pages verifies the artifact's origin with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
