# One-off check (2026-11-20): runs the V1'' probe's .ps1 twin tests (branch claude/v1pp-probe, 5d22b63) under pwsh 7,
# which the cloud session lacks. This branch never merges to main; the workflow has no token permissions.
name: pwsh-twins
on: push
permissions: {}
jobs:
  twins:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5d22b63f8ff2f92b12f1a223944ffd1f264eb082
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest
      - run: pwsh -Version
      - name: twin tests (sh and ps1)
        run: |
          git config --global user.name ci; git config --global user.email ci@example.invalid
          PWSH="$(command -v pwsh)" python -m pytest -q -p no:cacheprovider -rs tests/test_v1pp_probe.py 2>&1 | tail -60
          exit "${PIPESTATUS[0]}"
