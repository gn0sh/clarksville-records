# One-off check (2026-11-20): runs the protect-main and V1'' probe .ps1 twin tests (branch claude/protect-main-national) under pwsh 7,
# which the cloud session lacks. This branch never merges to main; the workflow has no token permissions.
name: pwsh-twins
on: push
permissions: {}
jobs:
  twins:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9cd398339225cf9b05b96ee0f64edbfa46b508da
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest
      - run: pwsh -Version
      - name: twin tests (sh and ps1)
        run: |
          git config --global user.name ci; git config --global user.email ci@example.invalid
          PWSH="$(command -v pwsh)" python -m pytest -q -p no:cacheprovider -rs tests/test_protect_main.py tests/test_national_workflow.py tests/test_v1pp_probe.py 2>&1 | tail -60
          exit "${PIPESTATUS[0]}"
