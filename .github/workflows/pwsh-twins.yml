# One-off check (2026-11-19): runs the .ps1 twin tests of PR #65's head under pwsh 7, which the cloud session lacks.
# This branch holds only review reports; this workflow never runs on main and has no token permissions.
name: pwsh-twins
on: push
permissions: {}
jobs:
  twins:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 36e55feb9eaae6e2f6c659e14faa586f69487426
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest
      - run: pwsh -Version
      - name: twin tests (sh and ps1)
        run: |
          git config --global user.name ci; git config --global user.email ci@example.invalid
          PWSH="$(command -v pwsh)" python -m pytest -q -p no:cacheprovider -rs \
            tests/test_cutover_data_off_main.py tests/test_protect_main.py tests/test_u3_toggle.py 2>&1 | tail -60
          exit "${PIPESTATUS[0]}"
