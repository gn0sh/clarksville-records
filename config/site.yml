# Locality and branding text for the site. Templates read every place name, body name and branding line from here,
# so another locality is a new copy of this file plus its own config/localities/<locality>/ (docs/status.md, ZIP note).
locality: montgomery-tn
site_name: "Daylight"               # quote: the deliver stage's reader takes one word or quoted text. Working product name (design/daylight, 2026-11-09); trademark check before go-live
site_place: Clarksville-Montgomery County   # name plate line under the name, on every page
site_timezone: America/Chicago   # the zone of the header's date line on every page (static/sky.js)
# Daylight Digest, the national pages under digest/ (ADR 0013, docs/architecture/daylight-national.md): off until the
# release task R1 (a production deploy: Brian's OK). Off, the build is byte-identical to one without the feature.
national: {enabled: false}
# The collectors' manifests (first_fetched_at by url and sha256). Every fetch day a page prints is the site_timezone
# day of that instant; a source with no row shows its stored UTC day labelled "(UTC day)" (docs/architecture/local-dates.md).
fetch_manifests:
  - data/manifest.json
  - data/county-agendas/manifest.json
  - data/localities/clarksville-tn/manifest.json
  - data/localities/clarksville-tn/fin-manifest.json   # the city budget books (collector fin-books)
  - data/localities/cmc-rpc/manifest.json
  - data/localities/clarksville-tn/committees/manifest.json
  - data/localities/montgomery-tn/committee-agendas/manifest.json
  - config/maps/manifest.json          # the source map PDFs (tools/fetch_map.py; a reviewed input, I-in)
today_place: Clarksville            # header date line: "Tuesday in Clarksville" (static/sky.js reads it from the page)
# The sky in the header (static/sky.js reads it from the page): the place whose sun and moon are drawn, in degrees
# (north latitude, east longitude; the city hall area, to two places). The sun shows while it is up there, the moon
# only while the sun is down. Remove the block and no moon is drawn, and the sun follows the viewer's own clock.
sky_place: {lat: 36.53, lon: -87.36}
operator: gnoshcodes LLC           # CEO decisions 2026-11-09 (a gnoshcodes product, no personal credit) and 2026-11-10 (the LLC)
operator_url: https://gnoshcodes.com/
# The person who runs the operator, named on the About page (Brian, 2026-11-11): an official id in a council's facts.
# The page reads the name, body, seat and vote-history link from the data (views.operator_person); no date is typed
# here, and the build fails if no built council has this official. Empty or absent: no line.
operator_person: city-brian-zacharias
# Launched or not (site-polish/about-preview, 2026-11-11). false: About says the site is a preview that has not
# launched. Go-live sets it to true in its own one-line PR, merged on the CEO's go-ahead before the first deploy
# (docs/ops/launch-runbook.md, Go-live step 3a). The build refuses anything but true or false.
live: true

# "Not sure of your district?" lookup link on the landing (the state elections site). Empty renders nothing; another
# locality sets its own. The site sends nothing there: it is a plain link the visitor chooses to follow.
district_lookup_url: https://web.go-vote-tn.elections.tn.gov/
district_lookup_label: GoVoteTN
# Landing address box ("Find your district"): the Census one-line address geocoder, called by JSONP only when the
# visitor submits an address (static/address.js adds the query). Empty renders no address box. Base URL only, no query.
# The box's own words name the geocoder (geocoder_label, geocoder_short) and link its privacy policy; all three are
# required when geocoder_url is set, as district_lookup_label is when district_lookup_url is. A build with
# `python -m sitegen --no-geocoder` draws no box (the claude.ai preview), only the plain lookup line.
geocoder_url: https://geocoding.geo.census.gov/geocoder/locations/onelineaddress
geocoder_label: the U.S. Census Bureau's geocoder   # "Your address is sent to <label> to find where it is."
geocoder_short: Census                               # "The Census places this address in ...", "Census's privacy policy"
geocoder_privacy_url: https://www.census.gov/about/policies/privacy.html
# Residents type the street only ("2861 McManus Circle"), which the Census does not match. When the typed address names
# no state (geocoder_state, geocoder_state_name) and no 5-digit ZIP, the box tries it with each mailing place below
# appended in turn ("2861 McManus Circle, Clarksville, TN"), one request at a time, stopping at the first match inside
# the county; a match outside it counts as no match. At most 5 places (5 requests per lookup). An address with a state
# or ZIP is sent once, as typed. Empty geocoder_places: always sent as typed.
geocoder_places: [Clarksville, Woodlawn, Cunningham, Southside, Palmyra]   # the county's mailing places, most first
geocoder_state: TN
geocoder_state_name: Tennessee

# "Unofficial copy. Official record:" line on every record page (views.official_record). A meeting page links its own
# minutes PDF; the pages that gather many meetings link the body's minutes listing; each council names its own in
# council.yml (record_url, record_label). Every URL here is one the collectors read (docs/platform-facts.md).
official_records:
  county: {url: "https://montgomerytn.gov/clerk/county-commission-minutes", label: "Montgomery County clerk, commission minutes"}
  finance: {url: "https://montgomerytn.gov/account-budget", label: "Montgomery County budget page"}
  city_finance: {url: "https://www.clarksvilletn.gov/966/Fiscal-Year-Budget-Reports", label: "City of Clarksville budget reports page"}
  contracts: {url: "https://montgomerytn.gov/purchasing/archive", label: "Montgomery County purchasing archive"}

# Footer support link (CEO, 2026-11-07). Rendered only when support_enabled is true AND support_url is set.
# Enabled 2026-11-09: Brian says his council seat is not a factor (he leaves it before anything goes live).
support_url: https://buymeacoffee.com/gnoshcodes
support_label: Buy Me a Coffee
# The ask shown beside the morning note sign-up and printed in the note's footer (Brian, 2026-11-10). Only with the support link on.
support_line: "This service is free and always will be, but web hosting and sending email cost money. If it is useful to you, please consider supporting the project."
support_enabled: true

# Cookie-free visitor counting (ADR 0008, docs/ops/analytics.md). OFF while `code` is empty: no page loads
# static/count.js, the CSP stays connect-src 'none' and nothing leaves the visitor's browser. `code` is the GoatCounter
# site code Brian picks at signup (https://<code>.goatcounter.com); turning it on is a one-line PR. Pages target only.
analytics: {provider: goatcounter, code: "daylight-gnosh"}   # Brian created the account, 2026-11-16

# Report an error (M1.5, docs/design/correction-intake.md). Every fact page links report.html, which offers these
# channels to the reader. Both empty (the default): report.html says corrections open when the site launches. Brian
# chooses the values; the build refuses anything else than the shapes below.
corrections:
  # Manager decision 2026-11-10 (corrections/channel-set-in-production-build): GitHub issues on the public repo. The
  # form must be on the repo's default branch for GitHub to show it. A pages build without a channel fails
  # qa/site_checks.py (report-channel).
  github_repo: "gn0sh/clarksville-records"   # "owner/name" of the PUBLIC repo: a prefilled issue from .github/ISSUE_TEMPLATE/correction.yml
  email: "brian@gnoshcodes.com"   # mailto link, listed first on report.html (Brian, 2026-11-13: "Report an error" should open an email to him)

# Alerts v1 (M5, sitegen/feeds.py): free Atom feeds on alerts.html. We keep no list of followers and run no
# sign-up. One "new agendas and minutes" feed per body (the county and each council below), and one feed per topic
# here, each an item_types key below, across every body. Leave the whole block out to build no feeds.
alerts:
  feed_id: "tag:daylight.gnoshcodes.com,2026-11-09:"   # names every feed and entry id; never change it (readers re-alert). Changed from records.* to daylight.* on 2026-11-10, before launch, so no reader was affected
  site_url: "https://daylight.gnoshcodes.com/"        # the public site's https base ending in "/", set at launch: feeds then carry absolute links
  max_entries: 50     # newest entries per feed (topic-rezoning.xml: per body)
  topics: [rezoning, budget, resolution, ordinance, appointment]
  contracts_title: "Contracts: purchasing solicitations"   # feeds/topic-contracts.xml (one entry per solicitation)

# The morning note (Daylight M3, sitegen/morning.py, docs/architecture/morning-note.md). Each build writes the last
# `keep_days` days' "what's new" as morning/YYYY-MM-DD.json plus morning/latest.json: every document whose
# first_fetched_at (in the collectors' own manifests, fetch_manifests above) falls in [day before at `cutoff`, day at `cutoff`) in
# site_timezone (pages target only; the preview build writes none). The sender (below) mails it; the build
# refuses `enabled: true` without an https form_action and privacy_url, and any form_action while enabled is false.
# Leave the whole block out to write no note.
morning_note:
  lists:          # keys are fixed (morning.LIST_KEYS); labels are what the page and the note print
    - {key: zoning, label: Zoning near me}
    - {key: seats, label: My two seats}
    - {key: budget, label: Budget}
    - {key: contracts, label: Contracts}
  cutoff: "07:00"
  keep_days: 7
  zoning_prefixes: [Z, ZO, CZ, CZO, HZ]   # rpc.yml City/County/Historic zoning case types
  # Backfill guard: a day holding a document from a collector's initial run (first fetched within initial_run_hours of
  # the earliest row of its manifest) or more than max_entries entries is written with "backfill": true and no
  # entries (its counts kept), so a first collection never becomes a mail.
  backfill:
    initial_run_hours: 48
    max_entries: 100
    # A later backfill of past meetings into a collector's manifest is never news: documents of meetings before
    # `before` in that manifest make no entry (sitegen/morning.py past_record_urls). RPC-3: the RPC's 2019-2021
    # meetings from CivicClerk (cmcrpc.com, collected since 2026-11-10, lists from 2022-01-25).
    past_records:
      - {manifest: data/localities/cmc-rpc/manifest.json, before: "2022-01-01"}
  # The collectors' manifests: the one list `fetch_manifests` above (dates/two-manifest-lists). Every document the
  # note reads must have a row in one.
  # Every connective word of the note (entries otherwise carry only the record's own words).
  text:
    agenda_item: On the agenda
    vote: Recorded in the minutes
    vote_unconfirmed: Recorded in the minutes; not confirmed
    agenda: Agenda posted
    minutes: Minutes posted
    budget_book: Budget book posted
    solicitation: New on the purchasing archive
    contract_document: New document
    unplaced_zoning: "{n} zoning cases printed no district or ward"
    unplaced_zoning_one: "1 zoning case printed no district or ward"
    # note/entry-meeting: which meeting each email entry is from. {meeting} is the site's own label for that body's
    # meeting kind, lower case ("formal meeting", "regular session"), or `meeting` when the body's labels are not
    # meeting kinds (the RPC's). {date} as the site writes a day ("November 9, 2026").
    meeting: meeting
    meeting_line: "{body}, {date} {meeting}"
  enabled: true         # switched on (runbook docs/ops/morning-note.md section 4 item 4); the form is public
  provider: Buttondown  # who receives the form, printed in its sent line; required when enabled; code never branches on it
  form_action: "https://buttondown.com/api/emails/embed-subscribe/daylight"       # the live newsletter (username `daylight`, T4.0 probe 2026-11-16); https URL the sign-up form POSTs to
  # Buttondown tags, never metadata__ fields (platform-facts "Morning note provider": on the free plan a new sign-up
  # carrying metadata__ fields answered 400). Lists, district and ward each post as a `tag` field whose value is a
  # fixed tag name (sender/common.py tag(): note-zoning, note-district-5, note-ward-3); the sender reads those tags
  # and ignores every other tag. The build refuses any other name for lists, district or ward.
  form_fields: {email: email, lists: tag, district: tag, ward: tag}
  privacy_url: "https://buttondown.com/legal/privacy"       # the provider's privacy policy, required when enabled (checked 2026-11-17, platform-facts)
  # The sender (ADR 0004; architecture "T4 sender"; package sender/). Switched on in this file; nothing is sent
  # until Brian sets the MORNING_NOTE_SEND variable and the BUTTONDOWN_API_KEY secret (runbook
  # docs/ops/morning-note.md section 5; hard stops 1 and 5). `python -m sender plan --rehearse` writes the would-send editions as a dry run.
  # The build refuses `enabled: true` unless morning_note.enabled is true and alerts.site_url is set. Going live
  # also needs Brian's repository variable and secret (hard stops 1 and 5). Keep each value below on its own line as
  # one plain value: the deliver stage reads this block without PyYAML (sender/settings.py).
  sender:
    enabled: true
    provider: buttondown
    api_base: https://api.buttondown.com/v1
    mode: stamp              # stamp | ids. T4.0 probe 2026-11-16: stamp works; ids cannot (send-draft only previews)
    send_at: "07:00"         # site_timezone
    latest_send: "10:00"     # a run that ends later than this skips the day; a note is never sent late
    # Emails one run may create (editions with a recipient). 2026-11-17, was 80: a busy real day plans up to 191
    # editions, so 80 would have sent nothing. 400 is about twice that. Basis (architecture "max_editions"):
    # Buttondown's documented 600 requests a minute (the client paces 5 a second), and no per-day email limit in
    # the docs read or the probe. Run time (sender/run-time-budget): 2 listings, an email per edition and 2
    # requests (re-read, stamp) per recipient, so at both caps (2 + 400 + 2 x 1000) x 0.2 s = 8 minutes, inside
    # the note job's 15. max_recipients was 2000 (about 14 minutes); the free plan stops at 100 subscribers.
    max_editions: 400
    max_recipients: 1000
    canary_only: false       # Brian, 2026-11-16: no canary week; every confirmed subscriber. true: only the ids in the note job's MORNING_NOTE_CANARY_IDS secret; none listed: nobody
    # The only hosts an email may link to (the plan stage drops any other link; the deliver stage refuses a body with
    # one): the collectors' source hosts. Add the site's own host before enabling. The support link is allowed as
    # exactly the top-level support_url, never its host: anyone can host a page there.
    link_hosts: "daylight.gnoshcodes.com,www.clarksvilletn.gov,montgomerytn.gov,www.cmcrpc.com,clarksvilletn.api.civicclerk.com,montgomeryminutes.bisonline.com,mcgtn.org"
    # Every word of the email that is ours. Neutral connective text only: no summary, no claim about anyone.
    text:
      subject: "{site_name} morning note, {date}"
      why: You get this note because a record on a list you picked was added to the site since yesterday morning.
      open_site: Open the page on the site
      # note/compact-untitled: in the seats section, one line for a meeting's votes whose record printed no title of
      # its own (two or more from one minutes document, never a zoning case), under the meeting line; the record's
      # item numbers follow on the next line (with none, the trailing colon is dropped). {n}: the count of votes.
      untitled_votes: "{n} votes in these minutes with no item title:"
      # note/sunrise (2026-11-22, design concept A "Sunrise" with concept C's plain words and invitation; the owner:
      # "celebrates their civic pride ... Your Local Government.. in Broad Daylight"). The header, the greeting and
      # the "Take part" box. {place}: top-level today_place; {site_name}: site_name; {weekday}: the note's day name.
      # Fixed text about the place, the records and open meetings: no sentence describes any body's conduct.
      header_day: "{weekday} in {place}"
      greeting: "Good morning, {place}."
      tagline: "Your local government, in broad daylight."
      intro: "Here is what is new on {site_name} for the lists you picked. Each item links to its official source where the source is public."
      new_on_list: New on your list
      # A card's source link. {date}: the meeting's day as the site writes it. A page number follows after page_label.
      source_meeting: "Source document, {date} meeting"
      source_document: Source document
      # "Read it in plain words." (concept C): only the definitions whose kind is in that edition (render.KINDS).
      # Each is "Term. Definition." and prints the term in bold. A person confirms these words before launch.
      plain_words: Read it in plain words.
      define_ordinance: Ordinance. A local law.
      define_resolution: Resolution. A formal decision or statement that is not a law.
      define_minutes: Minutes. The official written record of a meeting.
      define_bid_tab: Bid tab. A table of the bids received and their prices.
      define_award_letter: Award letter. The letter that names the bidder chosen.
      define_rfp: "RFP. A request for proposals: a government asking for offers to provide a service or product."
      take_part: Take part
      take_part_heading: This is your government. Its meetings are open to the public.
      take_part_line: "{site_name} lists each meeting by day, with a link to the official video where the body posts one."
      invited: You are invited.
      # The next meetings in the records on or after the note's day (the note's coming_up, the same for every reader;
      # no time or place: neither is collected). coming_body when the meeting kind repeats the body's name or is unknown.
      coming_up: Coming up
      coming_meeting: "{date}: {body}, {meeting}"
      coming_body: "{date}: {body}"
      all_meetings: "See all meetings, day by day"
      # The size rule (render.layout): past the byte budget the rest of an edition stands as one line each, and past
      # that as this one line, linking the day's note on the site. {n}: how many items are not shown.
      more: "{n} more on the site"
  # Every word the sign-up section (alerts.html#note) and the preview page (morning/index.html) print around the
  # records' own titles. Neutral connective text only: no summary, no claim about anyone.
  page:
    heading: Get the morning note
    about: A short email by 7:00 AM on days when something on your list is on an agenda or was voted on. Quiet on every other day.
    legend: Put on my list
    state_off: Email starts at launch; follow by feed now.
    feeds_heading: Feeds for your list
    no_feed: No feed for this list yet.
    seats_hint: No seats are saved on this device, so every feed for this list is shown. Find your district or ward by address on the home page and this device keeps it.
    seats_link: Find your seats
    preview_link: See today's note as it would read
    email_label: Email
    submit: Send me the morning note
    sent_line: "Sending this form gives {provider} your email address, the lists you picked, your saved district and ward if the box is ticked, and, like any website, your IP address."
    privacy_label: Privacy policy
    # Enabled state only (morning-security/seat-consent, privacy-text-matches-data-flow). seats_include labels the
    # form's visible box; the saved numbers are printed after it ("District 5, Ward 3"). seats_sent replaces the
    # "never sent anywhere" sentences on the landing and Method pages. method_* is the Method page's paragraph.
    # {box} in seats_sent and method_sent is filled with seats_include without its colon, so the sentences always
    # name the box by the label it carries (privacy-text/label-wording-drift).
    seats_include: "Include my saved seats:"
    seats_sent: "Your saved district and ward leave this device only if you sign up for the morning note and keep \"{box}\" ticked; then they go to {provider}."
    method_heading: Morning note
    method_sent: "The morning note is an email you sign up for on the Alerts page. Sending the sign-up form gives {provider} your email address and the lists you picked. Your saved district and ward go with it only while \"{box}\" is ticked; the form shows the numbers before you send it. None of this is sent until you send the form."
    method_unsubscribe: "To stop the email, use the unsubscribe link in any morning note."
    # sender/tags-seat-change: there is no preferences page (T4.0 probe), so a change is unsubscribe, then sign up
    # again. DEPENDS ON runbook check 4a: that a sign-up after unsubscribing leaves only the new tags. If the old
    # ones stay, this line is wrong (lists would add up, two seats would cancel out) and must change before launch.
    method_change: "To change your lists or seats, use the unsubscribe link in any morning note, then sign up again on the Alerts page with your new picks."
    # note/credit-logo-privacy: the email's footer logo (sender/common.py CREDIT_IMAGE) is loaded from this site.
    method_logo: "Each morning note ends with the gnoshcodes logo, as this site's footer does. The logo is loaded from this site when your email app shows images, so GitHub Pages, which hosts this site, may see your IP address and when the image was loaded."
    method_signup_link: Sign up on the Alerts page
    # The front page's invitation (front-signup, 2026-11-18; owner: the sign-up was only in the menu). Enabled state
    # only: one sentence saying what the note is, and the link to the form on the Alerts page (alerts.html#note).
    front_pitch: Get one short email at 7 AM on days when something new is posted.
    front_button: Sign up for the morning note
    preview_title: Today's morning note
    preview_lede: "The note as it would read on {date}: what was added to this site from {from} to {to}. Nothing is emailed yet."
    preview_mine: The lists you pick stay in this page's address on this device; nothing is sent.
    quiet: Nothing new on your list. On a day like this no note is sent.
    backfill: This day holds the first collection of a source, which is not sent as a note.
    unplaced_link: follow every zoning case
    source_label: Source
    page_label: page
    district_label: District
    ward_label: Ward
    vote_on_label: Vote on      # before what a confirmed roll call voted on ("Vote on: Amendment"; about.html#vote-on)

county_name: Montgomery County
county_body: Montgomery County Commission
city_name: City of Clarksville
city_body: Clarksville City Council
county_key: county                  # search index body key ("b") for county records
# Seat list names (landing list headings). `short` is the phone-width form.
district_layer: {label: County commission districts, short: Districts}
ward_layer: {label: City wards, short: Wards}
# Landing purpose line (h1). Neutral: what the site holds, no claim about anyone.
# Names every body the build covers (site-polish/home-heading, 2026-11-11; sitegen/views.py purpose_line): {bodies} is
# the bodies whose votes the site shows (county_body, each council's body_name, and purpose_rpc only while the RPC's
# motions are shown, not held); {plus} is purpose_plus naming the rest (purpose_rpc_records while its votes are
# held, purpose_finance when finance is built), or nothing. Lists are joined "A, B and C". Kept short for the phone's first
# screen, and it never says a body's votes are shown when they are not.
purpose: "Votes and records of the {bodies}{plus}, each linked to its source."
purpose_plus: ", plus records of {bodies}"
purpose_rpc: Regional Planning Commission
purpose_rpc_records: the Regional Planning Commission
purpose_finance: county finance
# Landing welcome (docs/design/front-page-v2.md, 2026-11-11): the h1 and one lede sentence. Neutral: what a visitor can
# find, no claim about anyone. {parts} is welcome_lede_parts joined "A, B and C", with welcome_lede_money last only when
# the finance pages are built (sitegen/views.py welcome_lede). `purpose` above stays for the meta description.
welcome_h1: "Your city and county government, on the record."
welcome_lede: "See {parts}. Every fact links to the official document it came from."
welcome_lede_parts: [who represents you, how they voted, when they meet]
welcome_lede_money: how the county spends money
# Phone only (viewport under 600px, mobile-front-lite): one short sentence shown in place of the lede above.
welcome_lede_phone: "Every fact links to its official document."
city_coming: City of Clarksville records are coming.   # shown only when no council is listed below
# Councils with their own pages beside the county (M4): each is config/localities/<locality>/council.yml.
councils: [clarksville-tn]
# The Regional Planning Commission's pages (milestone RPC-1): config/localities/<locality>/rpc.yml names its facts file
# and its page folder (sitegen/rpc.py). Leave it out to build no RPC pages.
rpc: cmc-rpc

# County commission seats, each given a page (districts/<nn>.html).
district_count: 21
district_label: District          # "District 7"
district_page_title: County Commission District   # "County Commission District 7"
meeting_title_body: County Commission              # "County Commission formal meeting, May 11, 2026" (meeting titles name the body)
ward_count: 12
ward_label: Ward
ward_map_owner: Regional Planning Commission   # whose map the ward lines come from ("on the <owner>'s map of <date>")
# Seats other than numbered districts and wards, in the fixed order the Officials page lists them after the districts.
other_seats:
  - {seat: county-mayor, label: County Mayor}
  - {seat: city-mayor, label: City Mayor}

# 2022 redistricting (design 4.2). Lines approved 2021-11-08. lines_effective is the internal split key between old
# and current lines (architecture, "Invariant: derived vs stated", cutover rule); pages never render it. Stated: the
# September 12, 2022 minutes (County Clerk's Report, "Oaths of Elected County Officials", p. 37) print the oath date
# 08/30/2022 for every commissioner, Districts 1 to 21, elected under the 2021 lines. No collected meeting falls
# between the oath and the first meeting under the new lines (2022-09-12), so the split is the same either side.
# Pages name the change as the county's own page titles it, linked (`redistricting_label`), and the observed
# boundary meetings either side; the split date itself is never rendered.
redistricting_label: 2021 redistricting
lines_effective: "2022-08-30"
lines_effective_printed: "08/30/2022"
lines_effective_source: "https://montgomeryminutes.bisonline.com/viewpdf.php?id=FlxXhUdsfwtztei0qxriLVjqyEFob9wSXd89%2BeNh7GQ%3D#page=37"
old_lines_map_url: ""             # the old county map PDF has not been found yet
redistricting_page: https://montgomerytn.gov/election/2021-redistricting
swapped_districts: [19, 20]
# The county's Elected Officials List prints Districts 19 and 20 with the numbers the roll-call tables use (the map
# PDF prints them the other way round). Cited by the map caption and the seat 19/20 pages.
swap_source: "https://montgomerytn.gov/storage/departments/election/Elected%20Officials%20List.pdf#page=9"

# Item type rule (design 5.4), mechanical and the same for every item; rendered on the About page. An item matches a
# type when its number starts with one of the prefixes, or its verbatim title contains one of the words (any case).
# AB- is not mapped: its meaning is still to be confirmed from the agendas (design Q4). "ORDINANCE " and "RESOLUTION "
# (with the space) are the kind words the City Council's minutes print in front of an item's number.
item_types:
  - {key: rezoning, label: Rezoning, prefixes: ["CZ-", "CZO-"], words: ["rezone", "rezoning", "zoning"]}
  - {key: budget, label: Budget and finance, prefixes: [], words: ["budget", "appropriat"]}
  - {key: resolution, label: Resolution, prefixes: ["RESOLUTION "], words: ["resolution"]}
  - {key: ordinance, label: Ordinance, prefixes: ["ORDINANCE "], words: ["ordinance"]}
  - {key: appointment, label: Appointment, prefixes: [], words: ["appoint", "nominat"]}

# Day by day (Daylight M2, sitegen/days.py, today.html): the week strip and day cards. The build writes every day from
# the start of the week `weeks_before` weeks before today (in site_timezone) to the end of the week `weeks_after`
# weeks after it; weeks start on `week_start`. static/days.js picks today in the same zone. The daily update rebuilds
# it, so the window moves with the date; a build left unrefreshed says which days it covers.
days:
  weeks_before: 4
  weeks_after: 4
  week_start: sunday
# County Commission meetings with an agenda and no minutes on this site yet (sitegen/county_agendas.py): the line a
# past meeting shows, as of the build date ({date}). Informal sessions: what this site holds, not a claim about the
# county's own pages (neutrality/unverified-county-claim). `list_lede` heads the list on meetings.html.
county_agendas:
  minutes_note: "Minutes not yet posted by the county, as of {date}."
  minutes_note_informal: "This site holds no minutes for informal sessions, as of {date}."
  list_lede: "Meetings the minutes on this site do not cover, from the agendas the county posted."
# The school board on the day page: a "coming soon" placeholder with one plain link, no collection. cmcss.net answers
# automated requests with a bot challenge (docs/research/rpc-cmcss-sources.md), so nothing is fetched from it and the
# board page's own path could not be read; the link is the district's home page until a person confirms the board
# page URL. Leave the block out to show no placeholder.
school_board:
  label: Clarksville-Montgomery County School System board
  url: https://www.cmcss.net/
  link_label: Clarksville-Montgomery County School System website
  # The menu entry and its "coming" page (school-board.html, site/templates/coming.html.j2), built only while the label
  # and url above are set. Every word of the page is here: no dates, no numbers, no names of officials.
  page:
    slug: school-board
    nav_label: School board
    title: School board
    lede: "Board meeting agendas are not collected yet; minutes are on the school system website."
    planned: ["Board meeting agendas, from the county website"]
    link_lede: "Until then, the official source is the school system website:"

# The school board's and the county finance committees' agendas, from the county's Committee Agendas page
# (collector/county_committees.py, sitegen/county_committees.py). `agendas` names the collector's config, which names
# the data file. Every word of these pages is here or in that config. The school board's hub replaces its "coming"
# page (school_board.page.slug) once its agendas are built; the finance committees' pages live under finance.slug.
# These bodies post no minutes online (the county) or post them where this site cannot read them (cmcss.net, a bot
# challenge): every meeting says so in a dashed COMING note, and no vote is shown. Leave the block out for no pages.
county_committees:
  agendas: config/localities/montgomery-tn/committee-agendas.yml
  school_lede: "Agendas of the Clarksville-Montgomery County School System (CMCSS) board, as the county posts them, each linked to its PDF."
  finance:
    slug: county-committees
    title: County finance committees
    lede: "Agendas of the Montgomery County Budget Committee, the budget hearings and the Audit, Investment, Purchasing and Delinquent Tax Sales and Release committees, as the county posts them, each linked to its PDF."
  agenda_note: "An agenda lists what may be taken up, not what was decided. No votes are shown for these meetings."
  minutes:
    school: "Minutes: the board's minutes and votes are on the school system's website, which this site does not collect from, so none are shown."
    county-finance: "Minutes: the county does not post this committee's minutes online, so none are shown."
  minutes_links:
    school: {from: school_board, kind: school}
  # the groups whose minutes line carries the `switch.not_collected_tag` word instead of "Coming" (Brian 2026-11-16)
  minutes_not_collected: [school]
  # A body stored with text: false (the school board): its agenda items can list students by name, so no item text
  # is shown, only the count (docs/architecture/agenda-withhold-invariant.md).
  no_text: "The items on this agenda are not shown on this site for now, because school board agendas can list students by name. Read them in the agenda PDF."
  older:
    text: "Agendas from before {year} are not collected yet: the county keeps them on another server that this site cannot reach yet."
  # Each school board meeting's official video (Brian 2026-11-18), from `file` (collector/school_videos.py): a link
  # only, never fetched. A meeting whose date has a matched video gets one Watch line per video (labels by kind: a
  # hearing is never called the meeting); any other gets the plain channel line. Every word is here.
  videos:
    file: config/localities/montgomery-tn/school-board-videos.yml
    link: Watch
    labels:
      meeting: "The district's own video of this meeting (opens YouTube)"
      hearing: "The district's own video of the hearing held that day (opens YouTube)"
      budget-hearing: "The district's own video of the budget hearing held that day (opens YouTube)"
    channel_lede: "Recordings:"
    channel_label: official CMCSS YouTube channel

# Official meeting video, per body key (county_key above; a council's and the RPC's body_key), Brian 2026-11-11
# (sitegen/watch.py): one plain "Watch" link to the page where the body itself posts its meeting video. A link only:
# nothing is ever fetched from it. A body with no official stream has no entry, and no link is ever guessed. `host`
# fills {host} in video_label. A council meeting whose own recording the facts carry links that instead
# (video_recording).
video:
  county: {url: "https://www.youtube.com/channel/UColCy-INQM4uZSqrJCeHTGg", host: YouTube}
  city: {url: "https://clarksvilletn.portal.civicclerk.com/", host: "the city's CivicClerk portal"}
  rpc: {url: "https://www.youtube.com/@CMCRPC", host: YouTube}
  # school: no entry here. The school board's meetings link their own videos, or the district's channel, from
  # config/localities/montgomery-tn/school-board-videos.yml (county_committees.videos above, Brian 2026-11-18).
video_link: Watch
video_label: "Official video channel (opens {host})"
video_recording: "Official video (opens the meeting's MP4 recording)"

# The committees page (committees.html), the menu entry and the day-page line, for the committees collected in their own
# blocks: the city's Finance and Audit committees (`city_committees:` below, built: city) and the county's Budget
# Committee (`county_committees:` above, built: county). sitegen/views.py committees_page decides from what the build
# makes: each `planned` line and each link whose body is not built shows as "coming" (plain links to the official source
# pages, docs/research/committee-sources-2026-11-11.md; nothing fetched); each body built is listed under
# `present_lede` with links to its pages. When every body is built the page has no Coming tag, says `built_lede`, and
# the day-page line is left out. Every word is here: no dates, no numbers, no names of officials. Leave the block out
# to show no menu entry, page or line.
committees:
  label: Committees
  links:
    - {url: "https://montgomerytn.gov/code/webshare/commission-committees-agendas.php", label: "Montgomery County committee agendas", built: county}
  page:
    slug: committees
    nav_label: Committees
    title: Committees
    lede: "Records of the committees below are being added. Their meetings are not collected yet, so none are shown here."
    built_lede: "The records of these committees are on this site, each linked to the committee's own documents."
    planned:
      - {text: "City Finance Committee agendas and minutes", name: City Finance Committee, built: city}
      - {text: "City Audit Committee agendas and minutes", name: City Audit Committee, built: city}
      - {text: "County Budget Committee agendas", name: County Budget Committee, built: county}
    # the county's bodies once built (county_committees.finance): `anchor` is a body's section on its index page
    county_present:
      - {label: Montgomery County Budget Committee, anchor: budget-committee}
      - {label: Montgomery County finance committees}
    present_lede: "Committees on this site:"
    link_lede: "Until then, the official sources are:"

# The City of Clarksville committees collected from the city's CivicClerk portal (sitegen/committees.py; collector:
# collector/committees.py, config/localities/<locality>/committees.yml, which holds hold_motions). One entry per
# committee: its slug in committees.json, the folder of its pages and the city hub card its pages turn from "coming"
# to present (switch.bodies.city.cards, `built`). url and label: the official record line on its pages, the coming
# card's link while it is coming and the committees page's link while no city committee page is built. Leave the
# block out to build no committee pages.
city_committees:
  locality: clarksville-tn
  url: "https://clarksvilletn.portal.civicclerk.com/"
  label: "City of Clarksville meetings portal (CivicClerk)"
  kicker: City of Clarksville
  pages:
    - {committee: finance, folder: city-finance-committee, card: finance-committee}
    - {committee: audit, folder: city-audit-committee, card: audit-committee}

# The "Show records from" switch (sitegen/bodies.py, static/switch.js; owner's mock 2026-11-12): on every page under
# the header, All plus one option per body whose hub page the build makes. Every word of the switch, the hub cards and
# the Finance page's top line is here. A card without `coming` is shown only when the build makes the page it links
# (sitegen/bodies.py _hrefs). A `coming` card is dashed and links the body's own official page: `link.from` is a
# dotted path into this file (or `rpc`, the RPC's record page in rpc.yml), so no URL is written twice and none is
# invented. Where no budget or committee page of a body is known, the link is that body's home page and says so.
# A coming card with `door: money` is also named under "Coming" in the home page's "Public money" door, with the same
# title, until it is no longer `coming` (sitegen/views.py door_coming): the one place those words are written.
switch:
  label: Show records from
  all: {label: All}
  overview:
    heading: Public bodies on this site
    lede: "Each body keeps its own records. Choose one to see only its records."
    fold: "What is here and what is coming"   # phone only: the one line that opens the list of bodies
    present: "On this site:"
    coming: "Coming:"
    not_collected: "Not collected:"
  # The tag of a card marked `not_collected: true` (Brian 2026-11-16): a record this site does not collect and has no
  # plan to, because its source does not allow it (the school board's votes and budget, on cmcss.net). Dashed and
  # linked to the official source like a coming card, but never named as coming: the hub card, the home page's
  # overview, the Public money door and the school board's minutes line all read this one word.
  not_collected_tag: Not collected
  finance_note:
    text: "These are the Montgomery County budget books. The school board budget is not shown on this site."
    # the city's budget pages, when built (sitegen/bodies.finance_note `sibling`)
    sibling: {lede: "The City of Clarksville budget books have their own pages:", label: City budget}
    link_lede: "It is on the school system's own website:"
    links:
      - {from: school_board, kind: school}
  # the top line of the city's budget pages (city/finance/index.html; finance-contracts 10)
  city_finance_note:
    text: "These are the City of Clarksville budget books. The school board budget is not shown on this site."
    sibling: {lede: "The Montgomery County budget books have their own pages:", label: County budget}
    link_lede: "It is on the school system's own website:"
    links:
      - {from: school_board, kind: school}
  bodies:
    county:
      label: Montgomery County
      slug: montgomery-county
      kicker: County government
      title: Montgomery County
      lede: "Records of the Montgomery County Commission, each linked to the county's own document."
      about: The Montgomery County Commission.
      cards:
        - {key: meetings, title: Meetings, text: "County Commission meetings, with attendance, motions and votes."}
        - {key: votes, title: Votes, text: "Every vote by year, linked to its page of the minutes."}
        - {key: finance, title: Finance, text: "The county budget books, fund by fund."}
        - {key: bids, title: Bids and awards, text: "Solicitations and awards listed in the county purchasing archive."}
        - {key: capital, title: Capital projects, text: "Capital projects in the county budget books."}
        - key: budget-committee
          title: Budget Committee            # named the way the city's committees are (owner, 2026-11-13)
          coming: true
          door: money
          text: "Budget Committee agendas are not collected yet, so none are shown."
          link: {from: committees.links.0, kind: committee}
          built: {text: "Budget Committee agendas as the county posts them, each line linked to its PDF page. No minutes are posted online.", go: Budget Committee agendas}
        - {key: finance-committees, title: Finance committees, go: All finance committees, text: "Agendas of the budget hearings and the Audit, Investment, Purchasing and Delinquent Tax committees."}
    city:
      label: Clarksville
      kicker: City government
      about: The Clarksville City Council.
      cards:
        - {key: meetings, title: Meetings, go: Meetings by year, text: "City Council meetings by year, with attendance, motions and votes."}
        - {key: votes, title: Votes, go: Votes by member, text: "Each council member's recorded votes."}
        - {key: transcripts, title: Transcripts, go: Latest meetings, text: "Transcripts of council meetings, linked from each meeting that has one."}
        - key: finance                       # city/finance/index.html (finance-contracts 10)
          title: City budget
          go: City budget books
          # {books}: the books read, from data/localities/clarksville-tn/finance.json (budget_views.books_phrase)
          text: "The city budget books, fund by fund: {books}."
        # One card per committee, as the county's Budget Committee has. `coming` until the build makes the
        # committee's pages (city_committees above); then the card is present with the `built` words.
        - key: finance-committee
          title: Finance Committee
          coming: true
          door: money
          text: "Finance Committee agendas and minutes are not collected yet, so none are shown."
          link: {from: city_committees, kind: committee}
          built: {text: "Finance Committee meetings, with agendas and minutes, attendance and motions as printed.", go: Meetings by year}
        - key: audit-committee
          title: Audit Committee
          coming: true
          door: money
          text: "Audit Committee agendas and minutes are not collected yet, so none are shown."
          link: {from: city_committees, kind: committee}
          built: {text: "Audit Committee meetings, with agendas and minutes, attendance and motions as printed.", go: Meetings by year}
    school:
      label: School board
      kicker: Clarksville-Montgomery County School System (CMCSS)
      about: The Clarksville-Montgomery County School System (CMCSS) board.
      # The hub's "What we can show" note (Brian 2026-11-16), shown on the hub only while its agendas are built
      # (committee_home.html.j2): what is here, what is not and why, and one plain link (official_link). cmcss.net
      # answers automated visitors with a bot challenge and this site never works around a block, so nothing is
      # collected from it (docs/research/rpc-cmcss-sources.md). The link is school_board.url, the district's home page,
      # until a person confirms the board page's own URL. Videos (Brian 2026-11-18): YouTube's terms do not allow
      # copying them, so each meeting links the district's own recording (county_committees.videos), never a copy.
      limits:
        heading: What we can show
        shown: "Shown here: the board's meeting agendas, taken from the county's website, and links to the district's own meeting videos."
        not_shown: "Not shown: the board's minutes, recorded votes and budget."
        why: "The school district blocks automated visitors to cmcss.net, and YouTube's terms do not allow copying videos. This site follows those rules: it shows the agendas the county posts and links each meeting to the district's own recording when one is posted, or to the district's YouTube channel."
        link_lede: "Find them on the official site:"
        link: {from: school_board, kind: school}
      cards:
        - key: meetings
          title: Meetings
          coming: true
          text: "Board meeting agendas are not collected yet; minutes are on the school system website."
          link: {from: school_board, kind: school}
          built: {title: Agendas, go: Agendas by year, text: "Study session and formal board meeting agendas, as the county posts them, each line linked to its PDF page."}
        - {key: votes, title: Votes, not_collected: true, text: "Recorded votes of the board are on the school system website, which this site does not collect from, so none are shown.", link: {from: school_board, kind: school}}
        - {key: budget, title: Budget, not_collected: true, door: money, text: "The school system budget is on the school system website, which this site does not collect from, so none is shown.", link: {from: school_board, kind: school}}
    rpc:
      label: Planning (RPC)
      short: RPC
      # the full name once, in the kicker; the h1 and the lede use the short name (onceover/rpc/hub-title-repeats:
      # the full name was the h1, about four lines on a phone, and was repeated in the kicker and the lede)
      kicker: Clarksville-Montgomery County Regional Planning Commission
      title: Regional Planning Commission
      lede: "Records of the Regional Planning Commission, each linked to the commission's own document."
      about: The Clarksville-Montgomery County Regional Planning Commission.
      note: "No budget of the Regional Planning Commission is collected, so none is shown."
      cards:
        - {key: meetings, title: Meetings, text: "Meetings, agendas and minutes listed on the commission's own page."}
        - {key: cases, title: Rezoning cases, text: "Case items on each meeting's agenda, as the agenda prints them."}
        - key: votes
          title: Votes
          coming: true
          text: "Votes are being checked against the minutes again and are not shown for now. Until then each motion links its page of the minutes."
          link: {from: rpc, kind: record}

# "Coming" pages (design 6). No numbers, no sample charts, no example values.
coming:
  - slug: finance
    title: Finance
    lede: "County budget books and audits (TN Comptroller) are planned. Nothing is shown here until it is collected from the source documents, and every figure will link to its page."
    planned: ["Approved county budgets", "Audited financial statements (TN Comptroller)", "Contracts"]
  - slug: capital-projects
    title: Capital projects
    lede: "Capital projects named in county budget books and commission resolutions are planned. Nothing is shown here until it is collected from the source documents, and every project will link to its page."
    planned: ["Projects named in approved budgets", "Commission resolutions that fund or change a project"]

# Independent and unofficial (launch blocker, owner 2026-11-10; sitegen/unofficial.py, qa/site_checks.py
# unofficial/notice-on-every-page). The ONE place this wording lives: the footer of every page, the header tag, the home
# page and About, every feed, the morning note's text and sign-up, the export README, <meta> and Open Graph tags and
# the <title> suffix all read it. Change a word here and every surface follows. {operator} is `operator` above and
# {bodies} is the `bodies` list below, joined "A, B, C, or D".
unofficial:
  tag: Independent, unofficial          # next to the site name on every page and in each <title>
  notice: "{site_name} is an independent, unofficial site run by {operator}. It is not affiliated with, endorsed by, or operated by {bodies}. The official record held by each body controls."
  # the Daylight Digest pages (digest/) say this instead: they cover every government, not only the four above
  digest_notice: "Daylight Digest is an independent, unofficial site run by {operator}. It is not affiliated with, endorsed by, or operated by any government it covers. The official record held by each body controls."
  correction_label: How to report a correction
  differ: If this site and the official document differ, the official document is right.
  not_advice: Nothing on this site is legal advice.
  email_line: "Independent, unofficial: not from or endorsed by any government body."   # short form for a mail footer
  # the home page's first-screen line (the full notice is in its footer, as on every page); {bodies} joins `short`
  short: "Not affiliated with or endorsed by {bodies}."
  bodies:     # name: as the notice prints it; short: in `short`; url: the body's own official site (About links each)
    - {name: the City of Clarksville, short: the City of Clarksville, label: City of Clarksville, url: "https://www.clarksvilletn.gov/"}
    - {name: Montgomery County, short: Montgomery County, label: Montgomery County government, url: "https://www.montgomerytn.gov/"}
    - {name: the Clarksville-Montgomery County School System (CMCSS), short: CMCSS, label: Clarksville-Montgomery County School System (CMCSS), url: "https://www.cmcss.net/"}
    - {name: the Clarksville-Montgomery County Regional Planning Commission, short: the Regional Planning Commission, label: Clarksville-Montgomery County Regional Planning Commission, url: "https://www.cmcrpc.com/"}
