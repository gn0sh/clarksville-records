show:
  # The Metro government is the county's card for every address in Davidson County, including the separately
  # incorporated cities. Kept whatever its FUNCSTAT (a consolidated government may carry C, not A).
  - {id: county-47037, why: "Nashville-Davidson metropolitan government: consolidated city-county (COUNTYCC H6)", source: "https://www.census.gov/library/reference/code-lists/class-codes.html"}

rules:
  # Connecticut: county governments abolished in 1960; since 2022 the Census uses nine planning regions
  # (09110-09190) as county equivalents. Neither the old counties nor the regions are governments that post agendas.
  - {state: "09", layer: county, show: false, why: "Connecticut has no county governments (abolished 1960); planning regions are county equivalents since 2022", source: "https://www.census.gov/programs-surveys/geography/technical-documentation/county-changes.html"}
  # Rhode Island: counties are geographic areas only, with no county government.
  - {state: "44", layer: county, show: false, why: "Rhode Island counties have no county government", source: "https://www.census.gov/library/publications/2019/econ/2017isd.html"}

