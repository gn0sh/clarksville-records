# Daylight Digest government flags (docs/architecture/daylight-national.md 3.3, 4.1 governments()). Curated
# corrections to what the Census geographies answer returns, applied in the browser after the FUNCSTAT filter:
#   hide:  ids never shown as a card (by id)
#   show:  ids always kept, whatever their FUNCSTAT (by id); an id may not be both hidden and shown
#   rules: by state FIPS code and layer (`show: false` hides every unit of that layer in that state)
#   lines: a fixed line for an id (`line` must have a `note.<line>` label in labels.yml). The line is added when the
#          Census returns that id for the address, whether the id is kept or dropped (by FUNCSTAT at step 1 or by
#          hide/rules here); a dropped county with a line adds that line instead of the "no county" line.
# Every entry needs `why` and an https `source`. Codes in `why` are COUNTYCC/PLACECC|FUNCSTAT from the Census 2020
# code files, verified 2026-11-19 (docs/platform-facts.md "Census TIGER/Line codes"). Several hides below are
# already dropped by step 1 (FUNCSTAT N or F, not A); they stay as a second guard in case a later Census vintage
# changes the FUNCSTAT, and each says so. No id here may be a directory government (load_all refuses it).
schema: daylight-govflags/1

hide:
  # Massachusetts: the Census 2020 county file marks nine counties H4|N (inactive county, nonfunctioning legal
  # entity): Berkshire, Essex, Franklin, Hampden, Hampshire, Middlesex, Nantucket, Suffolk, Worcester. Barnstable,
  # Bristol, Dukes, Norfolk and Plymouth are H1|A and are not listed. FUNCSTAT N already drops these at step 1.
  - {id: county-25003, why: "Berkshire County, MA: no county government (H4|N)", source: "https://www2.census.gov/geo/docs/reference/codes2020/cou/st25_ma_cou2020.txt"}
  - {id: county-25009, why: "Essex County, MA: no county government (H4|N)", source: "https://www2.census.gov/geo/docs/reference/codes2020/cou/st25_ma_cou2020.txt"}
