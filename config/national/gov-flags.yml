show:
  # The Metro government is the county's card for every address in Davidson County, including the separately
  # incorporated cities. The Census marks it H6|C (consolidated), which step 1 (keep A) would drop: `show` keeps it.
  - {id: county-47037, why: "Nashville-Davidson metropolitan government: consolidated city-county (H6|C)", source: "https://www2.census.gov/geo/docs/reference/codes2020/cou/st47_tn_cou2020.txt"}

rules:
  # Connecticut: the 2020 county file marks the eight old counties (09001-09015) H4|N; the planning regions that
  # replace them as county equivalents (09110-09190) are in the 2022 and later vintages (not checked). The rule
  # covers both. Neither the old counties nor the regions are governments that post agendas.
  - {state: "09", layer: county, show: false, why: "Connecticut has no county governments: old counties H4|N; planning regions are county equivalents since 2022", source: "https://www2.census.gov/geo/docs/reference/codes2020/cou/st09_ct_cou2020.txt"}
  # Rhode Island: all five counties (44001-44009) are H4|N in the 2020 county file.
  - {state: "44", layer: county, show: false, why: "Rhode Island counties have no county government (H4|N)", source: "https://www2.census.gov/geo/docs/reference/codes2020/cou/st44_ri_cou2020.txt"}

