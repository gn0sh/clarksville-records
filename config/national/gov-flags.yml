# Daylight Digest government flags (docs/architecture/daylight-national.md 3.3, 4.1 governments()). Curated
# corrections to what the Census geographies answer returns, applied in the browser after the FUNCSTAT filter:
#   hide:  ids never shown as a card (by id)
#   show:  ids always kept, whatever their FUNCSTAT (by id); an id may not be both hidden and shown
#   rules: by state FIPS code and layer (`show: false` hides every unit of that layer in that state)
#   lines: a fixed line for an id (`line` must have a `note.<line>` label in labels.yml). The line is added when the
#          Census returns that id for the address, whether the id is kept or hidden here; a hidden id with a line
#          adds that line instead of the "no county" line.
# Every entry needs `why` and an https `source`. Sources are Census documentation; what each says, and whether the
# team could read it, is in docs/platform-facts.md "Census TIGER/Line codes" (2026-11-19: the team's network refused
# the Census hosts, so every entry below is unverified until someone reads its source; task B2).
schema: daylight-govflags/1

hide:
  # Massachusetts: seven county governments abolished by state acts, 1997-2000; the state took over their offices. Suffolk County has no county commission: the City of Boston carries out its functions.
  # Barnstable, Bristol, Dukes, Norfolk and Plymouth keep county governments and are not listed. Nantucket (25019,
  # county and town are one) is left to the default until checked.
  - {id: county-25003, why: "Berkshire County, MA: county government abolished (2000)", source: "https://www.census.gov/library/publications/2019/econ/2017isd.html"}
  - {id: county-25009, why: "Essex County, MA: county government abolished (1999)", source: "https://www.census.gov/library/publications/2019/econ/2017isd.html"}
  - {id: county-25011, why: "Franklin County, MA: county government abolished (1997)", source: "https://www.census.gov/library/publications/2019/econ/2017isd.html"}
  - {id: county-25013, why: "Hampden County, MA: county government abolished (1998)", source: "https://www.census.gov/library/publications/2019/econ/2017isd.html"}
  - {id: county-25015, why: "Hampshire County, MA: county government abolished (1999)", source: "https://www.census.gov/library/publications/2019/econ/2017isd.html"}
  - {id: county-25017, why: "Middlesex County, MA: county government abolished (1997)", source: "https://www.census.gov/library/publications/2019/econ/2017isd.html"}
  - {id: county-25025, why: "Suffolk County, MA: no county commission; the City of Boston carries out county functions", source: "https://www.census.gov/library/publications/2019/econ/2017isd.html"}
  - {id: county-25027, why: "Worcester County, MA: county government abolished (1998)", source: "https://www.census.gov/library/publications/2019/econ/2017isd.html"}

  # Nashville: the "(balance)" place is the part of the consolidated Metro government outside the separately
  # incorporated cities (Belle Meade, Berry Hill, ...). It is the same government as county-47037, so it gets no card
  # of its own; its line says the city and county are one. An address in Belle Meade gets Belle Meade and Metro, no line.
  - {id: place-4752006, why: "Nashville-Davidson metropolitan government (balance): same government as county-47037 (PLACECC C8, balance of a consolidated city)", source: "https://www.census.gov/library/reference/code-lists/class-codes.html"}

  # Independent cities: the Census lists each as a county equivalent (COUNTYCC C7) and as an incorporated place. The
  # place card is the city; the county-equivalent copy is hidden and carries the independent-city line (lines below).
  # Pattern: in Virginia (state 51) county codes 510 and up are independent cities, counties are odd codes 001-199.
  # Bedford city (51515) became a town in Bedford County in 2013 and is not listed. Outside Virginia: Baltimore city,
  # St. Louis city, Carson City.
