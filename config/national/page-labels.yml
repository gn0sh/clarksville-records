  # How Daylight Digest works (design 9a; architecture 3.8, 3.9; security finding 8)
  how.title: "Daylight Digest: How it works"
  how.h1: How Daylight Digest works
  how.address: On the Daylight Digest page, the address you type goes from your browser straight to the US Census Bureau, which answers with the local governments for that spot. This site never receives the address, and it is not kept in your browser.
  how.device-intro: "After a lookup, your browser keeps a little in its local storage so the list is there next time. It uses three keys:"
  how.key-list: The names and IDs of the governments in your list. The names are the Census Bureau's public names.
  how.key-requested: The IDs of the governments you requested from this device.
  how.key-counted: The IDs of the governments you counted with "Just count me".
  how.device-after: These three keys hold no street address, no email address and no dates. "Forget this list" removes all three. A government's ID leaves your device only when you send a request, tap "Just count me", or open its coming-up page (that page's address names it; see Visits below).
  how.requests: "Sending a request gives Buttondown, our email service, your email address and the ID of each government you asked for, and, like any website, your IP address. Buttondown stores each government with your email as a tag, such as req-place-4715160. The governments you request show roughly where you are, usually down to your city or town and school district. They do not show your street address, which this site never gets."
  how.requests-2: "We use the tags for two things only: to count the requests for each government, and to email you once if one opens. The morning note goes only to people who pick its topics. A request on its own never gets it. [Buttondown: Privacy policy]"
  how.count: 'Tapping "No email? Just count me" sends one count to GoatCounter. It holds the ID of that government, as an event named count- plus the ID, and nothing else: no street address, no email address, no page address, no linking site and no screen size.'
  how.count-2: 'Like any web request, it tells GoatCounter your IP address and browser, so for that one request GoatCounter can see an IP address next to a government. GoatCounter says it does not keep the IP address. The button is not shown to browsers that send Do Not Track or Global Privacy Control. These counts are kept apart from email requests and are never added to them.'
  how.visits: "Visits to Daylight Digest pages are counted the same way as the rest of this site. On each page view the counter receives the page address, the site you came from (its name only, never its page), and your screen size. It never reads what you type. The address of a coming-up page names its government, so the visit count for that page names it too. The lookup page has one address for everyone, so its count says nothing about which governments were listed."
  how.back: "[Back to Daylight Digest]"

  # Request confirmed (design section 3, AC5.2)
  requested.title: "Daylight Digest: Request confirmed"
  requested.h1: Thanks. Your request is confirmed.
  requested.body: We'll email you once if we open a government you requested. We add a government only after real requests, one at a time. We may never reach yours, and we promise no date.
  requested.cant: If it is marked "Can't cover", we can't cover it unless the way it posts its records changes.
  requested.back: "[Back to Daylight Digest]"

