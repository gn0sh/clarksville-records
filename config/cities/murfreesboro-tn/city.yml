# Murfreesboro, TN: a DRAFT Daylight city (made by `python -m cities new` on 2026-11-16). Nothing is collected from it
# until `python -m cities check murfreesboro-tn` says READY and the owner gives the go-ahead for this city
# (docs/expansion/add-a-city.md). Brand keys (name, operator, coffee link, corrections email) are shared in
# config/brand.yml and can't be set here.
slug: murfreesboro-tn
name: Murfreesboro
state: TN
timezone: America/Chicago   # UNVERIFIED: given to `cities new`; confirm the city's own zone
status: draft                      # live only after the owner's go-ahead to deploy (a hard stop)
domain: murfreesboro.daylight.gnoshcodes.com
platform_facts: config/cities/murfreesboro-tn/platform-facts.md
sources:
  - {portal: agenda_center, config: config/cities/murfreesboro-tn/agenda_center.yml}
# Every host collection may ask. robots/terms: when and where each was read (e.g. "allows /x; 2026-11-20,
# platform-facts.md"); an unchecked one is marked. Never list a host that blocks automated tools.
allowed_hosts:
  - host: www.murfreesborotn.gov   # the Agenda Center's host (https://www.murfreesborotn.gov/agendacenter, CEO 2026-11-16)
    robots: UNVERIFIED
    terms: UNVERIFIED
denied_hosts: []                   # hosts of this city that must never be asked (a block seen, terms forbid)
launch:
  launch_days: 365                 # launch with the last year
  earliest: UNVERIFIED             # YYYY-MM-DD: how far back the portal holds minutes; backfill stops here
sky_place: UNVERIFIED              # {lat: .., lon: ..}: city hall, two decimal places, from an official source
district_lookup: {url: "https://web.go-vote-tn.elections.tn.gov/", label: GoVoteTN}   # Tennessee's, as Clarksville (CEO 2026-11-16)
geocoder_places: UNVERIFIED        # up to 5 mailing places in the city, most used first
verification_notes:
  - First target city (CEO, 2026-11-16). Same CivicPlus Agenda Center reader as Clarksville 2016-2024.
  - Nothing has been fetched from the city's site: the host, the body, the category and the years are still to check.
