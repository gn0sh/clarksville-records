# Holder records from sources other than the roll-call tables, appended to seats.yml (same folder) by tools/derive_seats.py.
# `name` is required when official_id is not in facts.json (printed as the source spells it).
# The county mayor does not vote in the commission's roll calls, so this seat comes from the roster only.
- official_id: wes-golden
  name: Wes Golden
  seat: county-mayor
  dates: sourced
  printed: "2022-2026"      # the list's own term wording, shown verbatim; start below is a sort key, never rendered
  start: "2022-09-01"
  end: null
  lines: current
  source: "https://montgomerytn.gov/storage/departments/election/Elected%20Officials%20List.pdf#page=6"
  note: "The list gives the term as 2022-2026; the day (1 September, when Tennessee county terms begin after the August election) is not printed in the source. The mayor before him is not yet sourced."
