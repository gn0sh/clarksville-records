# Clarksville-Montgomery County Regional Planning Commission (RPC): its meetings, agendas and minutes from the RPC's
# own site (milestone RPC-1). collector/rpc.py loads and checks this file; sitegen/rpc.py reads the same file for the
# site pages. Facts about the source: docs/platform-facts.md, "Regional Planning Commission"; survey:
# docs/research/rpc-cmcss-sources.md.
#
# robots.txt (www.cmcrpc.com, checked 2026-11-10): `User-agent: *`, crawl-delay 10, no Disallow. The polite fetcher
# reads robots.txt every run, checks every URL against it and waits the crawl-delay between requests.
# Links are taken from the listing page as printed; the collector never builds a document URL (the file names
# follow no single pattern).

locality: cmc-rpc
body: Clarksville-Montgomery County Regional Planning Commission
nav_label: Planning Commission      # the menu entry and the page names ("Planning Commission: Meetings 2025")
slug: rpc                           # every page of this body lives under <slug>/
body_key: rpc                       # search index body key ("b")
listing_url: https://www.cmcrpc.com/documents/agenda-minutes/
record_url: https://www.cmcrpc.com/documents/agenda-minutes/   # "Unofficial copy. Official record:" on the RPC home
record_label: Regional Planning Commission agendas and minutes page
facts: data/localities/cmc-rpc/rpc.json

# Hold every motion as "Not confirmed" (sitegen/rpc.py shown_motions, WHY_HELD). On since 2026-11-11: a review found
# the minutes reader confirming votes the minutes do not print (2026-05-26-regular-motion-2, 2026-06-23-regular-motion-4
# stored as "approve the consent agenda / passes"), and a wrong confirmed vote is never shown
# (docs/architecture/rpc-motion-invariant.md). While on: every page, day card and morning note shows each motion's type
# and its minutes page only, none under a case, and data/rpc/ exports no motion row; qa/site_checks.py fails any motion
# shown confirmed or exported. To lift: fix the reader (collector/rpc_minutes.py), rebuild rpc.json, spot-check it
# against the minutes, then set this to false (or delete the line) in its own reviewed PR.
hold_motions: true

# Hosts whose documents are fetched (also on collector/fetch.py ALLOWED_HOSTS). A listed link on any other host
# (Google Drive, YouTube) is kept in the listing with its URL and never requested.
fetch_hosts: [www.cmcrpc.com, cmcrpc.com]
fetch_extensions: [.pdf, .docx]

# Which body a listed row belongs to, from the row's label after the date (case-insensitive; the first match wins).
# Labels are shown as printed; the kind only groups the meetings and names the meeting id.
kind_rules:
  - [cdrb, '\bcdrb\b|common design review']
  - [executive, '\bexec']
  - [special, '\bspecial\b']
  - [regular, '^']
kind_labels:
  regular: Regional Planning Commission
  special: Regional Planning Commission, special called meeting
  executive: Regional Planning Commission, Executive Committee
  cdrb: Common Design Review Board

# Case types by case-number prefix, in the words of the agendas' own "CASE TYPE:" headings (CITY ZONING, COUNTY
# ZONING, SUBDIVISION(S), SUBDIVISION VARIANCE(S), SITE REVIEW(S), LANDSCAPE APPEAL(S), ABANDONMENT(S); agendas of
# 2026-06-23 to 2026-10-27). Read from the prefix, not the nearest heading: some agendas leave a heading out (the
# 2026-08-25 agenda prints its S- plats under "COUNTY ZONING"). A prefix not listed here shows as "Other case".
case_types:
  Z: City zoning
  ZO: City zoning
  CZ: County zoning
  CZO: County zoning
  S: Subdivision
  V: Subdivision variance
  SR: Site review
  LA: Landscape appeal
  AB: Abandonment
  MSCD: Design review     # CDRB agendas: "HISTORIC ZONING COMMISSION & COMMON DESIGN REVIEW BOARD CASES"
  DDR: Design review
  DO: Design review       # CDRB agendas from 2025-11: corridor overlay design review ("DO - 2 - 2026")
  HZ: Historic zoning     # CDRB agendas: Historic Zoning Commission cases ("HZ-3- 2025")

# RPC-3: the RPC's meetings before cmcrpc.com's listing starts (2022-01-25), from the City of Clarksville's CivicClerk
# portal, which files them under category "Regional Planning Commission" (id 38) from 2019-04-24. Same API, URL
# templates and checks as config/localities/clarksville-tn/civicclerk.yml (collector/civicclerk.py parse_config; robots
# and the reference-use judgment: docs/adr/0003). Facts: docs/platform-facts.md, "RPC 2019-2021 on CivicClerk".
# Every event dated before to_date is one listed meeting; its agenda and minutes files are fetched from the API host
# (at most BACKFILL_FETCH_CAP requests a run, collector/rpc.py) and read like the RPC's own (the same agenda and minutes
# readers, hold_motions above). The newer CivicClerk rows are left out: cmcrpc.com is the source from 2022 on.
civicclerk:
  api_host: clarksvilletn.api.civicclerk.com
  category_name: Regional Planning Commission
  from_date: "2019-01-01"
  to_date: "2022-01-01"           # before this day only; events_url must print the same bound (load_config checks)
  events_url: "https://{host}/v1/Events?$filter=categoryName%20eq%20%27{category}%27%20and%20startDateTime%20ge%20{from_date}T00:00:00Z%20and%20startDateTime%20lt%202022-01-01T00:00:00Z&$orderby=startDateTime%20asc"
  file_url: "https://{host}/v1/Meetings/GetMeetingFileStream(fileId={file_id},plainText=false)"
  agenda_types: [Agenda]
  minutes_types: [Minutes]
  video_hosts: [cpmedia.azureedge.net]     # required by parse_config; no RPC video is kept (none was seen)
  # Where these meetings are listed, for the meeting pages ("Listed as: ... on <listing_label>") and the export's
  # source_url. The portal is never fetched (ADR 0003): only the API host is.
  listing_url: https://clarksvilletn.portal.civicclerk.com/
  listing_label: City of Clarksville's CivicClerk portal
  # The event name is shown as printed ("Listed as") only when it matches this pattern in full (case-insensitive,
  # whitespace collapsed): the portal's free text, so anything else is shown as "<kind label>, <date>" and reported.
  printed_names: '(Regional Planning Commission|Common Design Review Board)( Meeting)?( Agenda| Minutes)?( -)? (\d{1,2}-\d{1,2}-\d{2}|[A-Z][a-z]+ \d{1,2}, \d{4})( CANCELLED)?'
  # Events filed under the category that are not an RPC meeting: left out and reported (event id and date only).
  skip_events:
    - event_name: 'Metropolitan Planning Organization\b.*'      # 2021-06-04: another body's agenda
      reason: another body (Metropolitan Planning Organization)
    - event_name: 'Regional Planning Zoning Review Notice\b.*'  # 2021-09-24: a notice letter ("RPC LTR"), no meeting
      reason: a notice, not a meeting
