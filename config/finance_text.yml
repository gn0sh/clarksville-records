# Fixed wording for the finance and contracts pages (docs/design/finance-contracts.md sections 2-5). One source:
# templates and sitegen/fin_views.py take every sentence from here, and tests check them by exact string. This file and
# glossary.html are the only places the banned-words lint skips (design 9). {braces} are filled from finance.json's
# coverage block (fin_checks.coverage), never counted again in sitegen.

coverage_contracts: "{n_tab} of {n_total} solicitations have a bid tab; this site reads {n_read} of them; {n_scan} of {n_letters} award letters are scanned images. Award letters are linked, not read."
coverage_budget: "{n_lines} budget lines from {n_books} books; {n_flag} totals do not add up as printed and are marked."

notes:
  a: "The amount shown is the total printed for each bidder on the bid tab (for some tabs a base bid, or a total including alternates, as labelled there). It is not the value of any contract."
  b: "Notice of intent, award letter and commission approval are separate events. Dates are shown per document."
  c: "This archive covers sealed solicitations only. Other purchases are not here, so nothing on this page adds up to what the county spent."
  c_short: "Archive covers sealed solicitations only."
  d: "This page shows the lines of the Capital Projects Fund under the headings the budget book uses, by year as printed (actual, amended, budget). A line is not the total cost of a project."
  e: "Amounts are whole dollars as printed in the book. Transfers and available funds are listed in their own section, and some printed totals include them, as each total says. No county-wide total is shown."
edition_note: "The two books print different figures for this line. Both are shown."

contracts:
  title: Bids and awards
  # stage word for each document stage (schema document.stage); the order of `stage_order` breaks date ties (design 5)
  stages:
    bid: Bid
    rfp: Request for proposals
    rfq: Request for quotes
    bid_tab: Bid tab
    notice_of_intent: Notice of intent
    notice_of_award: Notice of award
    award_letter: Award letter
    partial_award: Partial award
    qa: Questions and answers
    addendum: Addendum
    advertisement: Advertisement
    drawings: Drawings
    forms: Forms
    other: Other
  stage_order: [bid, rfp, rfq, bid_tab, notice_of_intent, notice_of_award, award_letter, partial_award, qa, addendum,
                advertisement, drawings, forms, other]
  # glossary entry ids for stage words that have one (first use in a table links to it, design 3)
  stage_glossary: {bid_tab: bid-tab, notice_of_intent: notice-of-intent, award_letter: award-letter, rfp: rfp}
  # the word before "p. n" in a source link, per source kind (schema source.kind)
  source_words: {bid: bid, rfp: request for proposals, bid_tab: bid tab, award_letter: award letter, notice: notice,
                 other: document, budget_book: budget book}
  has_tab: Has bid tab
  no_tab: No bid tab
  scanned_mark: Scanned
  scanned_row: "Scanned, read it yourself"
  scanned_detail: "This document is a scanned image. No amount, name or date has been read from it."
  dead_link: "Link not available at fetch ({date})"
  not_pdf: "Not a PDF. Linked, not read."
  link_only: "Linked, not fetched."
  shared: "The same link is listed for more than one solicitation, so nothing is read from it."
  no_date: "No date read"
  archive_date_empty: "No date printed"
  archive_link: archive page
  no_tab_detail: "No bid tab was found for this solicitation. Documents are listed above."
  tab_heading: "Bidders and totals as printed"
  not_read:
    layout: "This bid tab's layout is not one this site reads yet; open it to read it."
    scan: "This bid tab is a scanned image. No amount, name or date has been read from it."
    shared_url: "This bid tab link is listed for more than one solicitation, so nothing is read from it."
    not_fetched: "This bid tab link was not available to this site when the archive was read, so nothing is read from it. Open the link itself."
    not_pdf: "This bid tab is not a PDF file, so nothing is read from it. Open the file itself."
  bid_date: "Bid date as printed on the bid tab:"
  award_date: "Award date as printed on the bid tab:"
  awardee: "Awardee as printed on the bid tab: {name}."
  awardee_none: "The bid tab does not name an awardee."
  awardee_not_listed: "This name is not one of the bidders listed on the bid tab."
  awardee_ambiguous: "This name matches more than one bidder listed on the bid tab."
  differ: "Documents differ, read both."
  differ_fields: {awardee: Awardee, n_bidders: Number of bidders}
  no_department: "Not stated"
  empty_filter: "No solicitations match."
  clear_filters: Clear filters
  more: Show 25 more
  page_size: 25
  # sort choices: date and name only, never an amount or a count (AC-F8)
  sorts:
    - {key: new, label: Date newest}
    - {key: old, label: Date oldest}
    - {key: title, label: Title A-Z}
    - {key: dept, label: Department A-Z}
  docs_filter:
    - {key: "", label: Any}
    - {key: tab, label: Has a bid tab}
    - {key: notab, label: No bid tab}
  search_kind: Bids and awards
  words_toggle: Words used on this page
  # glossary entries shown in the "Words used on this page" toggle on contracts pages
  words: [award-letter, bid-tab, notice-of-intent, rfp]

# Why a value is held as Not confirmed*, by the check that held it (schema held.check, budget_line.held). One fixed
# sentence each; a held value whose check has no sentence here fails the build (no silent default). Vote pages keep
# their own sentence (_macros.html.j2 not_confirmed without a check).
held:
  amount-format: "The total is printed in a form this site does not read as a number."
  total-parts: "The printed amounts for this bidder do not add up to its printed total."
  column-align: "The amounts on this line do not sit under the book's columns in a way this site reads."
  derived-spill: "An amount on this line runs into a column this site does not read."
  scope-held: "This total adds a line this site does not read, so it is not checked."

# Finance and capital projects pages (design 6-7, slice 1b).
budget:
  title: Finance
  capital_title: Capital projects
  # the kind word under each column's printed header (schema column.kind) and its glossary entry, if any
  kinds: {actual: Actual, amended: Amended budget, adopted: Adopted budget, projected: Projected}
  kind_glossary: {actual: actual, amended: amended-budget, adopted: adopted-budget}
  sections:
    revenue: Revenue by source
    spending: Spending by department
    other: Transfers and available funds
  books_heading: Budget books
  funds_heading: Funds
  # {year}: a fiscal year with no Actual column in any book, between the first and last one that has it
  actuals_missing: "FY{year} actuals are not in these books."
  caption: "From: {title}, {edition}"
  role_words: {subtotal: Subtotal as printed, total: Total as printed}
  check:
    exact: Adds up
    within_rounding: Adds up within rounding
    does_not_add_up: "As printed, does not add up"
    not_checked: "Not checked: a line this total adds is held as not confirmed."
  # Owner's decision, 2026-11-08: a total that does not add up carries a note per affected column, with the numbers
  # from the check cells (printed, sum, diff = printed - sum). Fixed wording only: no commentary, no blame.
  # {header}: the column's printed header. {printed}, {sum}, {diff}, {abs}: whole dollars with thousands separators,
  # negatives in parentheses as the book prints them. {direction} is diff_higher or diff_lower.
  diff_note: "{header}: the book prints {printed}. The lines printed above it add up to {sum}. Difference: {diff} (the printed total is {abs} {direction})."
  diff_higher: higher
  diff_lower: lower
  diff_note_no_lines: "{header}: the book prints this total, {printed}, with no lines above it to add."
  diff_note_rounding: "{header}: off by {abs} because the book rounds each line to whole dollars."
  check_lines_link: Lines it was checked against
  flagged_heading: Totals that do not add up as printed
  flagged_caption: "{label} (p. {page}): the total as printed, then the lines it was checked against"
  flagged_no_lines: "The book prints no lines for this total to add."
  moved: "This total also adds lines listed under Transfers and available funds:"
  not_printed: not printed in this book
  not_in_book: "This fund is not in {book}."
  empty_section: "No lines of this kind are read from this book for this fund."
  no_heading: Lines printed without a heading
  jump: Go to a heading
  lines_word: lines
  line_word: line
  fund_page_link: "The whole fund, with its revenue, transfers and available funds:"
  capital_source: "{fund_name} ({fund_no}, {book}, pp. {first}-{last})"
  filter_name: Project name
  filter_book: Book
  empty_filter: "No project lines match."
  account: Account
  line: Line as printed
  project_line: Project line as printed
  source: Source
  fund_no: Fund
  fund_name: Name as printed
  fund_books: Books
  words: [actual, adopted-budget, amended-budget, fund]
  capital_words: [actual, adopted-budget, amended-budget, capital-project, fund]

# Design 3: alphabetical, one sentence each, no evaluation words. id = the anchor on glossary.html.
glossary:
  - {id: actual, term: Actual, text: "The amount the county's books show was received or spent in a finished fiscal year."}
  - {id: adopted-budget, term: Adopted budget, text: "The budget the commission passed at the start of a fiscal year."}
  - {id: amended-budget, term: Amended budget, text: "The adopted budget after changes made during the year."}
  - {id: award-letter, term: Award letter, text: "A letter from the county to the bidder it chose. Most are scanned images and are linked, not read."}
  - {id: bid-tab, term: Bid tab, text: "A table listing each bidder and the total it bid. Short for bid tabulation."}
  - {id: capital-project, term: Capital project, text: "A line the budget book lists under the Capital Projects Fund, shown under the heading the book uses. It is not the total cost of a project."}
  - {id: fund, term: Fund, text: "A separate set of accounts the county keeps for one purpose, with its own revenue and spending."}
  - {id: notice-of-intent, term: Notice of intent, text: "A notice that the county plans to award to a named bidder. It comes before an award letter."}
  - {id: rfp, term: RFP (request for proposals), text: "A document asking companies to propose how they would do work, and at what price."}
