# Fixed wording for the finance and contracts pages (docs/design/finance-contracts.md sections 2-5). One source:
# templates and sitegen/fin_views.py take every sentence from here, and tests check them by exact string. This file and
# glossary.html are the only places the banned-words lint skips (design 9). {braces} are filled from finance.json's
# coverage block (fin_checks.coverage), never counted again in sitegen.

coverage_contracts: "{n_tab} of {n_total} solicitations have a bid tab; this site reads {n_read} of them; {n_scan} of {n_letters} award letters are scanned images. Award letters are linked, not read."
coverage_budget: "{n_lines} budget lines from {n_books} books; {n_flag} totals do not add up as printed and are marked."

notes:
  a: "The amount shown is the total printed for each bidder on the bid tab (for some tabs a base bid, or a total including alternates, as labelled there). It is not the value of any contract."
  b: "Notice of intent, award letter and commission approval are separate events. Dates are shown per document."
  c: "This archive covers sealed solicitations only. Other purchases are not here, so nothing on this page adds up to what the county spent."
  c_short: "Archive covers sealed solicitations only."
  d: "This page shows the lines of the Capital Projects Fund under the headings the budget book uses, by year as printed (actual, amended, budget). A line is not the total cost of a project."
  e: "Amounts are whole dollars as printed in the book. Transfers and available funds are listed in their own section, and some printed totals include them, as each total says. No county-wide total is shown."
edition_note: "The two books print different figures for this line. Both are shown."

contracts:
  title: Bids and awards
  # stage word for each document stage (schema document.stage); the order of `stage_order` breaks date ties (design 5)
  stages:
    bid: Bid
    rfp: Request for proposals
    rfq: Request for quotes
    bid_tab: Bid tab
    notice_of_intent: Notice of intent
    notice_of_award: Notice of award
    award_letter: Award letter
    partial_award: Partial award
    qa: Questions and answers
    addendum: Addendum
    advertisement: Advertisement
    drawings: Drawings
    forms: Forms
    other: Other
  stage_order: [bid, rfp, rfq, bid_tab, notice_of_intent, notice_of_award, award_letter, partial_award, qa, addendum,
                advertisement, drawings, forms, other]
  # glossary entry ids for stage words that have one (first use in a table links to it, design 3)
  stage_glossary: {bid_tab: bid-tab, notice_of_intent: notice-of-intent, award_letter: award-letter, rfp: rfp}
  # the word before "p. n" in a source link, per source kind (schema source.kind)
  source_words: {bid: bid, rfp: request for proposals, bid_tab: bid tab, award_letter: award letter, notice: notice,
                 other: document, budget_book: budget book}
  has_tab: Has bid tab
  no_tab: No bid tab
  scanned_mark: Scanned
  scanned_row: "Scanned, read it yourself"
  scanned_detail: "This document is a scanned image. No amount, name or date has been read from it."
  dead_link: "Link not available at fetch ({date})"
  not_pdf: "Not a PDF. Linked, not read."
  link_only: "Linked, not fetched."
  unreadable: "Could not be read. Nothing has been read from it."
  shared: "The same link is listed for more than one solicitation, so nothing is read from it."
  no_date: "No date read"
  archive_date_empty: "No date printed"
  archive_link: archive page
  no_tab_detail: "No bid tab was found for this solicitation. Documents are listed above."
  tab_heading: "Bidders and totals as printed"
  not_read:
    layout: "This bid tab's layout is not one this site reads yet; open it to read it."
    scan: "This bid tab is a scanned image. No amount, name or date has been read from it."
    shared_url: "This bid tab link is listed for more than one solicitation, so nothing is read from it."
    not_fetched: "This bid tab link was not available to this site when the archive was read, so nothing is read from it. Open the link itself."
    not_pdf: "This bid tab is not a PDF file, so nothing is read from it. Open the file itself."
    unreadable: "This bid tab was fetched but could not be read, so nothing is read from it. Open the file itself."
  bid_date: "Bid date as printed on the bid tab:"
  award_date: "Award date as printed on the bid tab:"
  awardee: "Awardee as printed on the bid tab: {name}."
  awardee_none: "The bid tab does not name an awardee."
  awardee_not_listed: "This name is not one of the bidders listed on the bid tab."
  awardee_ambiguous: "This name matches more than one bidder listed on the bid tab."
  differ: "Documents differ, read both."
  differ_fields: {awardee: Awardee, n_bidders: Number of bidders}
  no_department: "Not stated"
  empty_filter: "No solicitations match."
  clear_filters: Clear filters
  more: Show 25 more
  page_size: 25
  # sort choices: date and name only, never an amount or a count (AC-F8)
  sorts:
    - {key: new, label: Date newest}
    - {key: old, label: Date oldest}
    - {key: title, label: Title A-Z}
    - {key: dept, label: Department A-Z}
  docs_filter:
    - {key: "", label: Any}
    - {key: tab, label: Has a bid tab}
    - {key: notab, label: No bid tab}
  search_kind: Bids and awards
  words_toggle: Words used on this page
  # glossary entries shown in the "Words used on this page" toggle on contracts pages
  words: [award-letter, bid-tab, notice-of-intent, rfp]

# Why a value is held as Not confirmed*, by the check that held it (schema held.check, budget_line.held). One fixed
# sentence each; a held value whose check has no sentence here fails the build (no silent default). Vote pages keep
# their own sentence (_macros.html.j2 not_confirmed without a check).
held:
  amount-format: "The total is printed in a form this site does not read as a number."
  total-parts: "The printed amounts for this bidder do not add up to its printed total."
  column-align: "The amounts on this line do not sit under the book's columns in a way this site reads."
  derived-spill: "An amount on this line runs into a column this site does not read."
  scope-held: "This total adds a line this site does not read, so it is not checked."

# Finance and capital projects pages (design 6-7, slice 1b).
budget:
  title: Finance
  capital_title: Capital projects
  # the kind word under each column's printed header (schema column.kind) and its glossary entry, if any
  kinds: {actual: Actual, amended: Amended budget, adopted: Adopted budget, projected: Projected,
          proposed: Proposed budget}
  kind_glossary: {actual: actual, amended: amended-budget, adopted: adopted-budget, proposed: proposed-budget}
  # under the Actual column of the year in progress, when the book prints its report date (book.report_dates)
  actual_as_of: "as of {date} (report date)"
  sections:
    revenue: Revenue by source
    spending: Spending by department
    other: Transfers and available funds
    net: Totals over revenue and spending   # only in a book that prints them (statement net: the city books)
  books_heading: Budget books
  funds_heading: Funds
  # {year}: a fiscal year with no Actual column in any book, between the first and last one that has it
  actuals_missing: "FY{year} actuals are not in these books."
  caption: "From: {title}, {edition}"
  caption_title_only: "From: {title}"
  role_words: {subtotal: Subtotal as printed, total: Total as printed}
  check:
    exact: Adds up
    within_rounding: Adds up within rounding
    does_not_add_up: "As printed, does not add up"
    not_checked: "Not checked: a line this total adds is held as not confirmed."
  # Owner's decision, 2026-11-08: a total that does not add up carries a note per affected column, with the numbers
  # from the check cells (printed, sum, diff = printed - sum). Fixed wording only: no commentary, no blame.
  # {header}: the column's printed header. {printed}, {sum}, {diff}, {abs}: whole dollars with thousands separators,
  # negatives in parentheses as the book prints them. {direction} is diff_higher or diff_lower.
  diff_note: "{header}: the book prints {printed}. The lines printed above it add up to {sum}. The printed total is {abs} {direction}."
  diff_label: Difference as printed
  diff_higher: higher
  diff_lower: lower
  diff_note_no_lines: "{header}: the book prints this total, {printed}, with no lines above it to add."
  diff_note_rounding: "{header}: off by {abs} because the book rounds each line to whole dollars."
  check_lines_link: Lines it was checked against
  flagged_heading: Totals that do not add up as printed
  flagged_caption: "{label} (p. {page}): the total as printed, then the lines it was checked against"
  flagged_no_lines: "The book prints no lines for this total to add."
  moved: "This total also adds lines listed under Transfers and available funds:"
  not_printed: not printed in this book
  not_in_book: "This fund is not in {book}."
  # provenance/fund-name-cross-book (manager's decision, 2026-11-18): a fund name a book prints cut short is completed
  # from another book only with this one fixed sentence on the fund page. {book}, {from_book}: "FY<year> (<edition>)".
  fund_name_cut: "The {book} book prints this fund's name cut short, as \"{printed}\"; the full name is from the {from_book} book."
  empty_section: "No lines of this kind are read from this book for this fund."
  no_heading: Lines printed without a heading
  jump: Go to a heading
  lines_word: lines
  line_word: line
  fund_page_link: "The whole fund, with its revenue, transfers and available funds:"
  capital_source: "{fund_name} ({fund_no}, {book}, pp. {first}-{last})"
  filter_name: Project name
  filter_book: Book
  empty_filter: "No project lines match."
  account: Account
  line: Line as printed
  project_line: Project line as printed
  source: Source
  fund_no: Fund
  fund_name: Name as printed
  fund_books: Books
  words: [actual, adopted-budget, amended-budget, fund]
  capital_words: [actual, adopted-budget, amended-budget, capital-project, fund]
  run_totals_name: Report totals
  not_read_default: "This book is linked, not read."
  not_read: {}

# The City of Clarksville's budget books (city/finance/, finance-contracts 10): the words that differ from `budget`.
budget_city:
  title: City budget
  books_heading: City budget books
  funds_heading: Funds
  fund_name: Fund as printed
  note_e: "Amounts are dollars and cents as printed in the book; revenue prints as a negative number, as the book prints it. Each book prints its line-item report one report run at a time, and its fund totals and report totals add revenue and spending together, as printed. Every total on the fund pages is printed in the book; none is added up there. The general fund dollar below says what it adds."
  run_totals_name: "Report totals (TOTAL REVENUE, TOTAL EXPENSE, GRAND TOTAL of each report run)"
  # one fixed sentence on city/finance/index.html: what the reader does not read (docs/research/
  # city-budget-build-2026-11-16.md item 5), then the official link (a config path, as switch notes use)
  not_covered:
    text: "Only each book's line-item report is read here; the Gas & Water comparison report, CDE electric and broadband, transit, outside agencies, CDBG, debt schedules and cash-flow summaries are not, and are in the full books on the"
    link: {from: official_records.city_finance, kind: record}
  not_read_default: "This book is linked, not read."
  not_read:
    fy2025-adopted: "Linked only, not read: its line-item pages have no usable text layer. Its FY2025 figures (2025 ORIG BUD, 2025 REVISED BUD, 2025 ACTUAL, 2025 PROJECTION) are printed in the columns of the Fiscal Year 2026 Budget (Final Submission), which is read here."
  words: [actual, adopted-budget, amended-budget, fund, proposed-budget]

# The general fund dollar on each Finance index (sitegen/dollar_split.py, finance-contracts 11; owner's request
# 2026-11-11). Plain and factual. First what a reader needs at a glance (one plain lede, the bar, its key, the list of
# every department); where every figure comes from and how the cents are rounded sit in the closed "Where these numbers
# come from" block. No evaluation words. {year}: the column's fiscal year; {body}: county or city; {fund}: the fund as
# printed; {book}: the book's title; {header}: the column as printed; {amount}: the fund total in the book's unit;
# {label}: the printed total line; {cite}: its page link; {n} in key_note: the cents from which a bar segment is named.
dollar:
  heading: Where each dollar of the general fund budget goes
  lede: "How the {body}'s FY{year} adopted general fund budget splits across departments, in cents of each dollar. This is the general fund only, not all of the {body}'s spending, and not property tax alone."
  key_label: "Departments named on the bar, left to right"
  key_note: "Named here: each department with {n} cents or more, left to right in the order the book prints them."
  total_line: "The whole bar is the general fund budget: {amount} dollars."
  total_amount: "{amount} dollars"
  list_heading: Every department
  list_order: in the book's order
  sources_toggle: Where these numbers come from
  source: "From {book}, column \"{header}\", the fund the book prints as \"{fund}\". Each department's amount is a total printed in the book, and each links to its page."
  total_printed: "Total: {amount} dollars, the book's own \"{label}\" line {cite}. The department totals add up to it exactly."
  total_net: "Total: {amount} dollars, the {n} department totals the book prints for this fund, added up here. The book prints no spending-only total for the fund; this sum and the fund's printed revenue totals together give its printed \"{label}\" line {cite} to the cent."
  measures: "This is the general fund only, not every fund in the book (the funds are listed below), so it is not all of the {body}'s spending."
  tax: "Property tax is one of the revenues the book lists for this fund, and the book does not say which revenue pays for which department, so this splits the whole general fund budget, not property tax alone. The fund's revenues:"
  # rounding, then rounding_exact or rounding_moved ({sum}: the rounded cents before the move; {n}: rows moved;
  # {names}: those rows; {way}: way_less or way_more; {most}: most_up or most_down)
  rounding: "Cents are each department's share of the total, rounded to the nearest whole cent, and always less than one cent from the exact share."
  # a newer book in the file that prints no adopted budget for its own year ({what}: its own-year column kinds,
  # e.g. "proposed budget"); {used}: the year the bar shows
  newer_note: "The newest book read here, FY{year} ({edition}), prints a {what} for that year, not an adopted one, so this uses the FY{used} adopted budget."
  newer_no_budget: "budget column of another kind"
  rounding_exact: "Rounded that way they add up to 100."
  rounding_moved: "Rounded that way they add up to {sum}, so the {n} rows {most} each show one cent {way}, and the cents add up to 100: {names}."
  rounding_moved_one: "Rounded that way they add up to {sum}, so the row {most} shows one cent {way}, and the cents add up to 100: {names}."
  most_up: rounded up the most
  most_down: rounded down the most
  way_less: less
  way_more: more
  order: "Departments are in the order the book prints them, with Other last. The bar, the list and the table show the same rows in that order."
  transfers: "Operating transfers to other funds are part of this fund's printed spending total, so they are a row here under the heading the book prints."
  other_name: "Other ({n} departments under half a cent each)"
  other_short: Other
  other_list: "The {n} departments in Other"
  other_sources: "Each department and its page are in the list under Other, above the table."
  zero: "Printed with no amount in \"{header}\" ({n}):"
  printed_as: "Printed as:"
  printed_as_n: "Printed as {n} totals"
  printed_as_1: "Printed as"
  caption: "Cents of each general fund dollar, by department, FY{year} adopted budget"
  col_dept: Department
  col_cents: Cents of each dollar
  col_source: Source
  total_row: General fund total
  cent_one: 1 cent
  cents_many: "{n} cents"
  bar_label: "The general fund dollar as a bar, 100 cents wide. The list below holds the same figures."

# The county property tax dollar (sitegen/property_tax.py, architecture finance-contracts 12). Owner's request
# 2026-11-18. Neutral and factual: the rate split as the resolution prints it, nothing about whether it is enough.
property_tax:
  heading: Where a county property tax dollar goes
  lede: "The county property tax rate for FY{year} is {rate} per $100 of assessed value. The county commission's tax rate resolution splits that rate across {n} funds. This is that split as printed in the {book}, in cents of each county property tax dollar."
  rate_line: "{rate} per $100 of assessed value"
  other_money: "This shows property tax only; funds can also get money from other sources, not shown here."
  city: "This is the county's property tax only. The City of Clarksville's property tax is separate and not shown here."
  key_label: "Funds named on the bar, left to right"
  key_note: "Named here: each fund with {n} cents or more, left to right in the order the resolution prints them."
  list_heading: Every fund
  list_order: in the resolution's order
  sources_toggle: Where these numbers come from
  source: "From Resolution {number}, \"{title}\", column \"{column}\", as printed in the {book}. Each fund's rate is per $100 of assessed value, exactly as printed, and its cents are its rate divided by the total rate."
  check: "The same book budgets current property tax (account {account}, column \"{column}\") in {n} of these funds, and each of those amounts is the same multiple of its rate:"
  per_dollar: "Each of those amounts is {amount} times its rate."
  # rounding, then rounding_exact or rounding_moved(_one) ({sum}: the shares rounded to the nearest tenth, added up;
  # {names}: the rows shown other than their nearest tenth; {way}: way_less or way_more)
  rounding: "Cents are each fund's share of the total rate in tenths of a cent: each share is cut to the tenth below, and the tenths left over go to the shares with the largest remainders (a tie to the larger share), so they add up to exactly 100.0 and each is less than a tenth of a cent from its exact share."
  rounding_exact: "Each is also its share rounded to the nearest tenth."
  rounding_moved: "Rounded to the nearest tenth they would add up to {sum}, so these rows each show one tenth {way} than their nearest tenth: {names}."
  rounding_moved_one: "Rounded to the nearest tenth they would add up to {sum}, so this row shows one tenth {way} than its nearest tenth: {names}."
  way_less: less
  way_more: more
  order: "Funds are in the order the resolution prints them. The bar, the list and the table show the same rows in that order."
  to_dollar: "How the general fund budget splits across departments"
  caption: "Cents of each county property tax dollar, in tenths of a cent, by fund, FY{year} tax rate"
  col_fund: Fund
  col_cents: Cents of each dollar
  col_source: Source
  total_row: Total tax rate
  printed_as: "Printed as"
  cents_many: "{n} cents"
  bar_label: "The county property tax dollar as a bar, 100 cents wide. The list below holds the same figures."

# Design 3: alphabetical, one sentence each, no evaluation words. id = the anchor on glossary.html.
glossary:
  - {id: actual, term: Actual, text: "The amount the books show was received or spent in a fiscal year. For a year still in progress when a book was printed, it runs to that book's report date."}
  - {id: adopted-budget, term: Adopted budget, text: "The budget the county commission or city council passed at the start of a fiscal year."}
  - {id: amended-budget, term: Amended budget, text: "The adopted budget after changes made during the year."}
  - {id: award-letter, term: Award letter, text: "A letter from the county to the bidder it chose. Most are scanned images and are linked, not read."}
  - {id: bid-tab, term: Bid tab, text: "A table listing each bidder and the total it bid. Short for bid tabulation."}
  - {id: capital-project, term: Capital project, text: "A line the budget book lists under the Capital Projects Fund, shown under the heading the book uses. It is not the total cost of a project."}
  - {id: fund, term: Fund, text: "A separate set of accounts the county or city keeps for one purpose, with its own revenue and spending."}
  - {id: proposed-budget, term: Proposed budget, text: "A budget as presented for a vote, before it is adopted. The city's FY2027 book as presented 5/29/2026 prints the Mayor's proposal."}
  - {id: notice-of-intent, term: Notice of intent, text: "A notice that the county plans to award to a named bidder. It comes before an award letter."}
  - {id: rfp, term: RFP (request for proposals), text: "A document asking companies to propose how they would do work, and at what price."}
