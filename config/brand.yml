# Daylight's shared brand: one copy for every city (docs/adr/0007-multi-city-template.md). cities/brand.py loads it;
# every key here is LOCKED: a city's city.yml (or its `site:` block) that sets one fails validation.
# The Buy Me a Coffee link and its switch are also pinned in code (cities/brand.py BMAC_URL), so changing them takes a
# reviewed code change, never a city file.
#
# Clarksville's config/site.yml still carries the same keys (its live build reads them there). tests/test_cities.py
# fails if the two drift; the duplicates in site.yml are removed in a follow-up after Clarksville round 2 lands.
site_name: "Daylight"
operator: gnoshcodes LLC
operator_url: https://gnoshcodes.com/
support_url: https://buymeacoffee.com/gnoshcodes
support_label: Buy Me a Coffee
support_line: "This service is free and always will be, but web hosting and sending email cost money. If it is useful to you, please consider supporting the project."
support_enabled: true
# Used only when a city sets `place_name` (ADR 0012 decision 9); {site_name} and {place} are filled in. A city without
# one (Clarksville) keeps its unchanged footer and the support_line above.
named_lines:
  footer: "{site_name} {place} is provided as a free service by"
  support: "{site_name} {place} is free and always will be, but web hosting and sending email cost money. If it is useful to you, please consider supporting the project."
corrections:
  email: "brian@gnoshcodes.com"
