[project]
name = "clarksville-records-collector"
version = "0.0.1"
requires-python = ">=3.11"
description = "Collector, parser and verifier for Clarksville / Montgomery County public records (M1)"
dependencies = ["pyyaml", "jsonschema", "jinja2"]   # system tools: poppler-utils (pdftotext, pdftoppm), tesseract-ocr

[project.optional-dependencies]
dev = ["pytest", "ruff"]
maps = ["pdfplumber", "shapely"]   # tools/extract_pdf_map.py only; the site build never needs them

[tool.pytest.ini_options]
testpaths = ["collector/tests", "tests"]

[tool.ruff]
line-length = 125

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E741"]          # `l` for a text line in short comprehensions
