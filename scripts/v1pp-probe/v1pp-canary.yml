# V1'' probe canary (docs/architecture/v1-fail-2026-11-18.md section 4, target W; scripts/v1pp-probe.ps1).
# Inert on purpose: it starts only by hand, grants nothing, and its one job never runs. The probe script puts this
# file on the throwaway branches probe/v1pp-w and probe/v1pp-w-bot as .github/workflows/v1pp-canary.yml; the probe
# checks that GitHub refuses GITHUB_TOKEN merging it into main. It must never be on main; if it ever is, a person's
# PR removes it.
name: V1pp canary (inert)
on: workflow_dispatch
permissions: {}
jobs:
  never:
    if: false
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - run: echo "never runs"
